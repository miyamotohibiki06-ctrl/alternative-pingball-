/* ------------------------------------------------------------
   V26 FULLSCREEN DIRECT TOUCH
   No virtual controller. The entire game surface is the controller:
   LEFT THIRD / CENTER THIRD / RIGHT THIRD.
   ------------------------------------------------------------ */
html,body{
  width:100%;height:100%;min-height:100%;
  margin:0;overflow:hidden;
  background:#050608;

  position:fixed;inset:0;

  height:100vh;

  max-height:none;

  margin:0;
  box-shadow:none;
  overflow:hidden;

   PINBALL SYNTH v18.4

function resize(){
  const r=canvas.getBoundingClientRect();
  dpr=Math.min(2.25,devicePixelRatio||1);
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.height*dpr));

  // Largest possible uncropped 16:15 playfield inside the physical screen.
  // The canvas itself still fills the entire phone/tablet viewport.
  scale=Math.min(r.width/WORLD.w,r.height/WORLD.h);
  worldOffsetX=(r.width-WORLD.w*scale)*.5;
  worldOffsetY=(r.height-WORLD.h*scale)*.5;
  ctx.setTransform(
    scale*dpr,0,0,scale*dpr,
    worldOffsetX*dpr,worldOffsetY*dpr
  );
  ctx.imageSmoothingEnabled=true;
}
const viewportResizeObserver=new ResizeObserver(resize);
viewportResizeObserver.observe(shell);
viewportResizeObserver.observe(canvas);
addEventListener("orientationchange",()=>{
  setTimeout(resize,60);
  setTimeout(resize,240);
},{passive:true});
if(window.visualViewport)visualViewport.addEventListener("resize",resize,{passive:true});
resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let __testNow=null;
function nowMs(){return __testNow===null?performance.now():__testNow;}
const C={bg:"#080b0c",upperBg:"#091116",lowerBg:"#0d0e0b",paper:"#eef1e8",muted:"#707a73",line:"#303a37",soft:"#141b19",accent:"#ff6b3b",cool:"#66c8bf",green:"#a6cf76"};
function portraitLayoutMetrics(viewW,viewH,safeTop=0,safeBottom=0){
  const portrait=viewH>=viewW;
  const canvasH=portrait?Math.min(viewW*.9375,viewH*.52):Math.min(viewH,viewW/1.0666667);
  const canvasW=portrait?Math.min(viewW,canvasH*1.0666667):Math.min(viewW,viewH*1.0666667);
  const controlTop=portrait?safeTop+canvasH+6:0;
  const controlH=portrait?Math.max(0,viewH-controlTop-safeBottom):0;
  return{portrait,canvasW,canvasH,controlTop,controlH};
}

const SCREEN={LOWER:0,UPPER:1};

/* ============================================================
   SONG ENGINE — PLAY HISTORY BECOMES COMPOSITION

   This is deliberately not a conventional synth panel.
   The player writes an arrangement by playing pinball:

   LAUNCH       -> pulse begins
   BUMPER       -> percussion memory
   SLING        -> syncopation / echo memory
   NOTE LANES   -> harmony memory
   UPPER LOOP   -> arpeggio memory
   CENTER       -> melody phrase
   C ARRANGER   -> alternate melody / counterline
   CLEAR        -> full arrangement / coda

   narrow-band digital tones, deep delay/reverb, small timing offsets.
   Complexity comes from layering and phrasing, not from a huge oscillator UI.
   ============================================================ */

const MINI_SAVE_KEY="pinballSynthMiniGameV8";

function defaultMiniSave(){
  return {
    version:18,
    stage:"BREAKOUT",
    gameMode:"A",
    brokenMask:0,
    breakoutCleared:false,
    phraseUnlocked:false,
    raceUnlocked:false,

    musicMask:0,
    lastMusicRole:"",
    lastStageId:"BREAKOUT",
    lastSavedAt:0,
    saveSerial:0
  };
}

let miniSave=defaultMiniSave();

function loadMiniSave(){
  try{
    const raw=localStorage.getItem(MINI_SAVE_KEY);
    if(!raw){miniSave=defaultMiniSave();return miniSave}
    const parsed=JSON.parse(raw);
    miniSave=Object.assign(defaultMiniSave(),parsed||{});
    if(!miniSave.stagePerfects||typeof miniSave.stagePerfects!=="object")miniSave.stagePerfects={};
    if(!miniSave.arcadeCheckpoints||typeof miniSave.arcadeCheckpoints!=="object")miniSave.arcadeCheckpoints={};
    if(!miniSave.raceResume||typeof miniSave.raceResume!=="object")miniSave.raceResume={distanceM:0,checkpoints:0,combo:0,nearMisses:0,crashes:0};
    // V21: old saves keep every musical layer corresponding to already-cleared story stages.
    ["STATIC","CLIMBER","TEMPEST","LANDER","JOUST","BUBBLE","HOCKEY","ROPE","DARUMA"].forEach(k=>{if(miniSave.arcadeCheckpoints)delete miniSave.arcadeCheckpoints[k]});
    const clearedForMusic=clamp(miniSave.storyStage|0,0,10);
    const inferredMask=clearedForMusic<=0?0:((1<<clearedForMusic)-1);
    miniSave.musicMask=((miniSave.musicMask|0)|inferredMask)&0x3ff;
    if(clearedForMusic<10)miniSave.musicMask&=~(1<<9);
    // V25: the removed legacy ending system was removed entirely.
    delete miniSave.legacyPointsRemoved;
    delete miniSave.legacyReadRemoved;
    miniSave.version=18;
  }catch(_){
    miniSave=defaultMiniSave();
  }
  return miniSave;
}

function writeMiniSave(reason="AUTO"){

    song.rhythmStage=4;
    song.noteMask.fill(1);
    song.percussion=Math.max(song.percussion,6);
    song.slings=Math.max(song.slings,2);
    song.loops=Math.max(song.loops,3);

    // The next song does not reset. It reframes the same material.
    // Rotation + ghost-shift keeps identity while proving it can develop.
    if(song.songNo>1){
      const rot=(song.songNo*3)%16;
      song.rhythmMap=[...song.rhythmMap.slice(rot),...song.rhythmMap.slice(0,rot)];
      song.rhythmHits=[...song.rhythmHits.slice(rot),...song.rhythmHits.slice(0,rot)];

    for(let i=0;i<16;i+=2)if(song.arp[i]<0)

    const phraseBank=[
      [9,7,6,4,7,6,4,2],
      [7,9,11,9,7,6,4,2],
      [11,9,7,6,9,7,6,4],
      [9,11,9,7,6,4,7,2]

    const finalPhrase=phraseBank[(song.songNo-1)%phraseBank.length];
    [0,2,4,6,8,10,12,14].forEach((p,i)=>song.melody[p]=finalPhrase[i]);

    scheduleSongReward(now);

function guidedHash(a,b,c){

function twMusicalSlotForNow(now){
  const eighthMs=60000/song.bpm/2;
  const epoch=musicEpoch||now;
  const rel=Math.max(0,now-epoch);
  const raw=rel/eighthMs;
  const slot=Math.floor(raw);
  const phase=raw-slot;

  // touch:waves-like feel rule:
  // if the gesture lands just after a grid line, allow it to belong to that grid;
  // otherwise push it forward. Never target a slot already scheduled.
  let target=(phase<.15)?slot:slot+1;
  if(phase<.15)song.twImmediateSnaps++;
  else song.twFutureSnaps++;
  target=Math.max(target,song.twLastProcessedSlot+1);
  return target;
}

function twWriteShadow(role,power,targetSlot){
  const idx=((targetSlot%16)+16)%16;
  const prev=song.twShadowWrite[idx];

function twCommitShadowCycle(absEighth){
  if(absEighth<=0 || absEighth%16!==0)return;

  song.twShadowCycle++;
  song.archiveCycles++;
  const learned=song.twShadowWrite.filter(Boolean).length;

  if(learned){
    // Preserve sparse previous material only where the player left silence.
    const next=Array(16).fill(null);
    for(let i=0;i<16;i++){
      const fresh=song.twShadowWrite[i];
      const old=song.twShadowPlay[i];
      if(fresh) next[i]={...fresh,age:0};
      else if(old && old.age<2 && (i%4!==3)) next[i]={...old,power:old.power*.72,age:old.age+1};
    }
    song.twShadowPlay=next;
    song.twShadowLearned+=learned;
    if(learned>=4){
      song.archiveDepth=Math.min(12,song.archiveDepth+1);
      song.resonanceXP+=Math.max(1,Math.floor(learned/3));
      updateMasteryState(nowMs());
    }
  }else{
    song.twShadowPlay=song.twShadowPlay.map(e=>e?{...e,power:e.power*.68,age:e.age+1}:null);
  }
  song.twShadowWrite=Array(16).fill(null);
}

function queueGuidedIntent(role,power=.5,now=nowMs(),force=false){
  role=clamp(role|0,0,4);
  if(!force && power<.20){song.guidedDropped++;song.twRejected++;return false}

  const target=twMusicalSlotForNow(now);
  const group=TW_ROLE_GROUP[role];
  const lastGroup=song.twGroupLast[group]??-99;

  // group exclusivity / force-mono behavior.
  if(!force && target-lastGroup<1 && power<.78){
    song.guidedDropped++;song.twRejected++;return false;
  }

  // Same role cannot chatter repeatedly.
  const lastRole=song.guidedLastRole[role]||-99;
  if(!force && target-lastRole<2 && power<.72){
    song.guidedDropped++;song.twRejected++;return false;
  }

  const existing=song.guidedQueue.find(e=>e.slot===target);
  if(existing){
    // One live foreground winner per slot.
    if(power>existing.power){
      existing.role=role;existing.power=power;existing.source="live";
    }else{
      song.guidedDropped++;song.twRejected++;return false;
    }
  }else{
    song.guidedQueue.push({slot:target,role,power,serial:++song.guidedSerial,source:"live"});
  }

  song.guidedLastRole[role]=target;
  song.twGroupLast[group]=target;
  song.twAccepted++;
  twWriteShadow(role,power,target);

  if(song.guidedQueue.length>16){
    song.guidedQueue.shift();song.guidedDropped++;song.twRejected++;
  }
  return true;
}

  if(song.guidedWorld===0 && candidate===3)candidate=1;

function renderGuidedIntent(ev,whenMs){
  const inputRole=ev.role;
  const backdrop=clamp(song.twBackdrop|0,0,TW_BACKDROPS.length-1);
  const mappedRole=TW_ROLE_MAP[backdrop][inputRole];
  const world=GUIDED_WORLD[song.guidedWorld]||GUIDED_WORLD[1];
  const bg=TW_BACKDROPS[backdrop];
  const snap=harmonySnapshotForWhen(whenMs);
  const cells=GUIDED_CELLS[mappedRole];

function processGuidedSlot(absEighth,whenMs){

  const due=song.guidedQueue.filter(e=>e.slot<=absEighth);
  song.guidedQueue=song.guidedQueue.filter(e=>e.slot>absEighth);

  // Shadow loop is the player's previous performance, interpreted by the CURRENT backdrop.
  const shadow=song.twShadowPlay[((absEighth%16)+16)%16];
  if(shadow && shadow.power>.16){
    due.push({
      slot:absEighth,
      role:shadow.role,
      power:shadow.power,
      serial:++song.guidedSerial,
      source:"shadow"

  if(!due.length)return;

  // Live gesture wins. Shadow only fills or reinforces musical space.
  due.sort((a,b)=>{

    return sb-sa || b.power-a.power || a.serial-b.serial;

  renderGuidedIntent(due[0],whenMs);

  }
}

function scheduleBreakoutDrums(step,bar,whenMs){
  const level=clamp(song.drumBuildActive|0,0,6);
  const upper=upperContributionMix();
  const hatMix=upper.w===1?(1.12+.10*upper.mastery):1;
  const percMix=upper.w===2?(1.08+.08*upper.mastery):1;
  const surgeMix=(upper.surge?1.10:1)*miniMusicDebutGain("BREAKOUT");

  if(level>=1){
    const hats=(level>=4)?[1,5,9,13]:[2,6,10,14];
    if(hats.includes(step)){
      const accent=(step===1||step===9)?1.0:.84;
      const ghost=level>=4?.55:1.0;
      drumClosedHat((.76+(level>=6?.07:0))*accent*ghost*hatMix*surgeMix,
                    whenMs,step<8?-.11:.11);
    }
  }

  if(level>=2 && (step===4||step===12)){
    const backbeat=step===12?1.04:1.0;
    drumClap((.72+(level>=6?.07:0))*backbeat*surgeMix,whenMs);
  }

  if(level>=3 && (step&1)){
    const shakerAccent={1:.60,3:1.00,5:.68,7:.84,9:.60,11:1.00,13:.68,15:.92}[step]||.65;
    drumShaker(.43*shakerAccent*hatMix,whenMs,step<8?-.17:.17);
  }

  // OPEN HAT = all four offbeat eighths (裏打ち)
  if(level>=4 && (step===2||step===6||step===10||step===14)){
    const accent=(step===2||step===10)?1.0:.92;
    drumOpenHat(.59*accent*hatMix*surgeMix,whenMs,step<8?-.07:.10);
  }

  if(level>=5 && (step===3||step===11)){
    drumPerc(.57*percMix*surgeMix,whenMs,step===3?-.18:.18);
  }

  if(level>=6 && bar%4===3 && (step===13||step===15)){
    drumPerc(step===15?.50:.38,whenMs,step===13?-.12:.12);
  }
}

let acidLastSemi=null;
function acidArpVoice(semi,vel=.62,whenMs=nowMs(),cutoff=1500,res=8.5,slide=0,pan=0){
  if(!audioReady||!acidBus)return;

  const t=AC.currentTime+Math.max(0,(whenMs-nowMs())/1000);
  const f=65.406*Math.pow(2,semi/12);

  const osc=AC.createOscillator();
  const subOsc=AC.createOscillator();
  const subGain=AC.createGain();
  const mix=AC.createGain();
  const flt=AC.createBiquadFilter();
  const env=AC.createGain();

  osc.type="sawtooth";
  subOsc.type="square";

  const startF=(slide>0 && acidLastSemi!==null)
    ?65.406*Math.pow(2,acidLastSemi/12)
    :f;

  osc.frequency.setValueAtTime(startF,t);
  osc.frequency.exponentialRampToValueAtTime(f,t+.020+.040*slide);

  subOsc.frequency.setValueAtTime(f*.5,t);
  subGain.gain.value=.16;

  mix.gain.value=.76;

  flt.type="lowpass";
  flt.Q.value=clamp(res,4,14);

  const peak=Math.max(700,cutoff);
  flt.frequency.setValueAtTime(Math.max(320,peak*.28),t);
  flt.frequency.exponentialRampToValueAtTime(peak,t+.018);
  flt.frequency.exponentialRampToValueAtTime(Math.max(360,peak*.42),t+.118);

  env.gain.setValueAtTime(.0001,t);
  env.gain.exponentialRampToValueAtTime(.095*vel,t+.003);
  env.gain.exponentialRampToValueAtTime(.0001,t+.145);

  osc.connect(mix);
  subOsc.connect(subGain);
  subGain.connect(mix);
  mix.connect(flt);
  flt.connect(env);

  if(AC.createStereoPanner){
    const p=AC.createStereoPanner();
    p.pan.value=pan;
    env.connect(p);
    p.connect(acidBus);
  }else{
    env.connect(acidBus);
  }

  osc.start(t);
  subOsc.start(t);
  osc.stop(t+.155);
  subOsc.stop(t+.155);

  acidLastSemi=semi;
  song.acidDriveNotes++;
  song.acidDriveLastSemi=semi;
  song.acidDriveLastCutoff=cutoff;
  song.acidDriveLastAt=whenMs;
  if(slide>0)song.acidDriveSlides++;
}

function scheduleRaceAcid(step,bar,whenMs,snap){
  const rc=raceAcidContext();
  const reward=(song.acidDriveRewardBars>0||miniMusicHas("DRIVE"))&&state.mode===MODE.PLAY;
  if(!rc&&!reward)return;

  // TRUE 16TH ARPEGGIATOR:
  // one note on EVERY master 16th step.
  // Car movement changes the pitch of the NEXT step, never the timing.
  const gi=step&15;

  let norm=.5,motion=.12,near=0;
  if(rc){
    norm=rc.norm;
    motion=rc.motion;
    near=rc.near;
  }

  // Continuous car position -> 5 musical zones.
  // Still only curated chord degrees, so harmony cannot collapse.
  const zone=
    norm<.20?0:
    norm<.40?1:
    norm<.60?2:
    norm<.80?3:4;

  song.acidDriveLane=zone;

  // Each horizontal zone has its own 16-step contour.
  // Moving the car therefore audibly changes the very next 16th.
  const maps=[
    [0,1,0,2, 0,1,3,1, 0,2,1,4, 0,1,2,1], // far left / low
    [0,2,1,3, 0,2,4,2, 1,3,2,4, 0,2,3,1], // left
    [0,1,2,3, 4,3,2,1, 0,2,4,3, 1,2,3,4], // center
    [2,3,4,2, 3,4,1,4, 2,4,3,1, 4,2,3,4], // right
    [4,3,4,2, 4,3,1,3, 4,2,4,1, 3,4,2,4]  // far right / high
  ];

  let degree=maps[zone][gi];

  // Steering intent biases the NEXT note more strongly.
  const steerFresh=(nowMs()-song.raceSteerIntentAt)<260;
  const steer=song.raceSteerIntent;
  if(steerFresh){
    if(steer>.22)degree=Math.min(4,degree+1);
    else if(steer<-.22)degree=Math.max(0,degree-1);
  }

  // Register follows car position continuously.
  const octave=zone<=1?2:(zone===2?3:4);
  const semi=chordTone(degree,octave,snap);

  const boost=(nowMs()<song.raceBoostUntil)?1:0;
  song.raceBoost=boost;

  // Car motion is timbral performance:
  // faster steering = more open / more resonant / more slide.
  const steerAmt=Math.abs(steer);
  const cutoff=
    900 +
    norm*1650 +
    motion*1700 +
    steerAmt*1200 +
    near*700 +
    boost*900 +
    (reward?300:0);

  const resonance=
    6.8 +
    motion*3.3 +
    steerAmt*2.1 +
    near*1.2 +
    boost*.8;

  const slide=
    (steerFresh || motion>.45)
      ? clamp(.18+.58*motion+.24*steerAmt,0,.92)
      : (gi%4===3?.18:0);

  // Slight 4-step velocity shape, but NO timing variation.
  const accent=[1.00,.70,.82,.74][gi%4];
  const roleBoost=reward?miniMusicDebutGain("DRIVE"):1;
  const vel=(reward?.43:.66)*accent*(boost?1.08:1)*roleBoost;

  acidArpVoice(
    semi,
    vel,
    whenMs,
    cutoff,
    resonance,
    slide,
    (norm-.5)*.82
  );

  song.acidDrivePeak=Math.max(song.acidDrivePeak,cutoff);
  song.acidDriveLastStep=step;
}

function scheduleRaceObstacle(step,bar,whenMs){
  if(typeof bonusGame==="undefined"||bonusGame.stage!=="RACE")return;
  const r=bonusGame.race;if(!r.started)return;
  const progress=clamp((bar-r.startBar)/Math.max(1,r.goalBars),0,1);
  const hard=progress>.72;

  // EASY DRIVE:
  // first half = one hazard per bar
  // later = at most two per bar
  const baseSpawn=(step===0);
  const lateSpawn=hard&&step===8;
  if(!(baseSpawn||lateSpawn))return;
  let lane=Math.abs(guidedHash(bar,step,r.seed)|0)%3;

  // Never lock the same lane repeatedly.
  if(r.lastLane===lane)lane=(lane+1+(bar&1))%3;

  // During late double-spawn, deliberately choose a different lane
  // from the first hazard so one obvious escape lane remains.
  if(step===8 && r.lastLane===lane)lane=(lane+1)%3;

  r.lastLane=lane;
  if(r.pendingSpawns.length<24){
    r.pendingSpawns.push({at:whenMs,lane,fast:hard&&((bar+step)%5===0)});
  }

  // Musical route elements: readable targets, not just hazards.
  if(step===0 && bar%2===0){
    const gateLane=(lane+1)%3;
    spawnRaceGate(whenMs,gateLane,"GROOVE");
  }
  if(step===8 && bar%4===1){
    const pickupLane=(lane+2)%3;
    spawnRacePickup(whenMs,pickupLane);
  }
}



function chipPulse(semi,vel=.35,whenMs=nowMs(),dur=.10,pan=0,bright=.5){
  if(!audioReady||!chipBus)return;
  const t=AC.currentTime+Math.max(0,(whenMs-nowMs())/1000);
  const f=65.406*Math.pow(2,semi/12);
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();

  o.type="square";
  o.frequency.value=f;
  lp.type="lowpass";
  lp.frequency.value=2200+bright*4800;
  lp.Q.value=.42;

  // anti-click micro envelope
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.030*vel,t+.0025);
  g.gain.setValueAtTime(.030*vel,t+Math.max(.004,dur*.60));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  o.connect(lp);lp.connect(g);
  if(AC.createStereoPanner){
    const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(chipBus);
  }else g.connect(chipBus);
  o.start(t);o.stop(t+dur+.012);
}

function chipTriangle(semi,vel=.25,whenMs=nowMs(),dur=.14){
  if(!audioReady||!chipBus)return;
  const t=AC.currentTime+Math.max(0,(whenMs-nowMs())/1000);
  const f=65.406*Math.pow(2,semi/12);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type="triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.025*vel,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(chipBus);o.start(t);o.stop(t+dur+.01);
}

function chipNoise(vel=.16,whenMs=nowMs(),dur=.035,pan=0){
  if(!audioReady||!chipBus)return;
  const t=AC.currentTime+Math.max(0,(whenMs-nowMs())/1000);
  const len=Math.max(64,Math.floor(AC.sampleRate*dur));
  const b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  let prev=0;
  for(let i=0;i<len;i++){
    const n=Math.random()*2-1;
    prev=prev*.35+n*.65;
    d[i]=prev*Math.pow(1-i/len,1.8);
  }
  const s=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();
  hp.type="highpass";hp.frequency.value=3600;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.018*vel,t+.001);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.buffer=b;s.connect(hp);hp.connect(g);
  if(AC.createStereoPanner){
    const p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(chipBus);
  }else g.connect(chipBus);
  s.start(t);s.stop(t+dur+.005);
}

function kingdomChipLevel(){
  if(typeof bonusGame==="undefined"||bonusGame.stage!=="KINGDOM")return 0;
  const k=bonusGame.kingdom;
  const progress=clamp(k.player.x/k.worldW,0,1);
  const collect=Math.min(1,(song.kingdomItems+song.kingdomBlocks*.35)/12);
  return clamp(Math.floor(progress*3.6+collect*1.2),0,4);
}

function scheduleKingdomChip(step,bar,whenMs,snap){
  if(state.mode!==MODE.BONUS||typeof bonusGame==="undefined"||bonusGame.stage!=="KINGDOM")return;
  const level=kingdomChipLevel();
  const k=bonusGame.kingdom;
  const phrase=KINGDOM_MOTIFS[(song.bonusTier+k.checkpoint)%KINGDOM_MOTIFS.length];

  // L0: sparse 8-bit pulse on quarter/eighths.
  if(step%4===0){
    const degree=phrase[(step/2)%8|0];
    chipPulse(chordTone(degree,3,snap),.32,whenMs,.095,(degree-2)*.08,.35);
  }

  // L1: 8th-note pulse counterline.
  if(level>=1&&step%2===0){
    const degree=phrase[(step/2)%8];
    chipPulse(chordTone(degree,3+(step>=8?1:0),snap),.28,whenMs,.072,(step<8?-.18:.18),.52);
  }

  // L2: triangle bass makes it feel like a real console arrangement.
  if(level>=2&&(step===0||step===4||step===8||step===12)){
    const d=step===8?2:0;
    chipTriangle(chordTone(d,0,snap),.45,whenMs,.16);
  }

  // L3: full 16th sparkle. Still chord-safe.
  if(level>=3&&(step&1)){
    const degree=phrase[(step+bar)%8];
    chipPulse(chordTone(degree,4,snap),.17,whenMs,.045,(step%4<2?-.28:.28),.72);
  }

  // L4: noise percussion / final-stage console intensity.
  if(level>=4){
    if(step===4||step===12)chipNoise(.34,whenMs,.055,0);
    if(step===2||step===6||step===10||step===14)chipNoise(.17,whenMs,.024,step<8?-.22:.22);
  }
}

function scheduleTransportStep(step,bar,whenMs){
  const qt=whenMs,bar16=bar%16;
  twUpdateGestureInterpreter(whenMs);
  song.coreBar=bar16;
  maybeAdvanceHarmonyChapter(step,bar,whenMs);
  song.harmonyAnchorAt=whenMs;
  song.harmonyAnchorCoreBar=bar16;
  song.harmonyAnchorStep=step;
  setHarmonyIndex(progressionForChapter()[bar16],whenMs);
  const snap=harmonySnapshotForWhen(whenMs);

  // World changes only on bar boundaries, just like a background-track context switch.
  if(step===0){
    twMaybeChangeBackdrop(bar);
  }

  if(step===0 && song.pendingWorld>=0){
    song.guidedWorld=song.pendingWorld;
    song.activeUpperMode=song.guidedWorld;
    song.pendingWorld=-1;
  }

  // =========================================================
  // BACKGROUND BED: always coherent, never authored by collisions.
  // =========================================================
  // RHYTHM IS EARNED.
  // NEW GAME begins as pure ambient harmony. The first BREAKOUT unlock
  // introduces the kick together with the first percussion layer.
  if(song.drumBuildActive>=1 && [0,4,8,12].includes(step)){
    const tier=scoreEmotionTier();
    const pleasure=clamp(song.guidedPleasure+.10*tier,0,1);
    const bg=TW_BACKDROPS[song.twBackdrop]||TW_BACKDROPS[1];
    grooveKick((.66+.08*pleasure+(step===0?.05:0))*bg.sub,qt);

    if(song.transportKickTimes.length>96)song.transportKickTimes.shift();
  }

  // BREAKOUT GROOVE. The drum arrangement is read only from the hard master grid.
  if(step===0)applyDrumBuildAtBarBoundary();
  scheduleBreakoutDrums(step,bar,qt);

  if(step===0){
    if(song.featurePhrasePending){
      song.featurePhrasePending=false;
      song.featurePhraseBars=2;
      song.featurePhraseBar=0;
      song.featurePhrasePlays++;
      eventFlash("FEATURE PHRASE / 2 BARS",whenMs,1100,.92);
    }else if(song.featurePhraseBars>0){
      song.featurePhraseBars--;
      if(song.featurePhraseBars>0)song.featurePhraseBar++;

        if(state.mode===MODE.BONUS&&bonusGame.stage==="PHRASE_PLAY"){
          startRaceStage(whenMs,bar);
        }
      }
    }
    if(song.acidDriveRewardBars>0)song.acidDriveRewardBars--;
    if(song.kingdomRewardBars>0)song.kingdomRewardBars--;
  }
  scheduleSpectacleBody(step,bar,qt,snap);
  scheduleStoryMemory(step,bar,qt,snap);

  // SCORE-DRIVEN FORM DEVELOPMENT. Harmony changes are the main event; these
  // sparse layers make each chapter audibly different without adding timing chaos.
  const hChapter=song.harmonyChapter|0;
  if(hChapter>=1 && step===8 && bar%2===1){
    ambientGlassSemi(chordTone(4,3,snap),.075+.012*hChapter,.42,.28,qt,.54+.05*hChapter);
  }
  if(hChapter>=2 && (step===6||step===14)){
    const d=step===6?2:4;
    chipPulse(chordTone(d,3,snap),.13+.018*hChapter,qt,.07,step===6?-.28:.28,.52+.06*hChapter);
  }
  if(hChapter>=3 && step===0 && bar%2===0){
    warmVoiceSemi(chordTone(0,-2,snap),.036,.90,-.10,-.32,qt);
    warmVoiceSemi(chordTone(2,-1,snap),.021,.78,.12,-.25,qt+.03);
  }
  if(hChapter>=4 && (step===4||step===12)){
    airShimmer(chordTone(step===4?2:4,4,snap),.10,qt,.34,step===4?-.24:.24);
  }

  scheduleKingdomReward(step,bar,qt,snap);
  scheduleKingdomChip(step,bar,qt,snap);
  scheduleMiniGameMusicLayers(step,bar,qt,snap);
  scheduleFeaturePhrase(step,bar,qt,snap);
  scheduleRaceAcid(step,bar,qt,snap);
  scheduleRaceObstacle(step,bar,qt);

  // DANCE BASS: every offbeat eighth locks against the four-on-floor.
  // Fixed grid only. No collision timing, no random rests.
  if(song.drumBuildActive>=1 && (step===2||step===6||step===10||step===14)){
    const rootSemi=chordTone(0,-2,snap);
    const bassAccent=(step===2||step===10)?1.0:.84;
    mellowBodyBass(rootSemi,(.52+.08*song.guidedPleasure)*bassAccent,qt,.245,
                   step<8?-.035:.035);

    // Deep sub support is sparser than the body bass, keeping 40–60 Hz clean.
    if(step===2||step===10){
      deepSubHit(49,(.17+.035*song.guidedPleasure),qt,.235);
    }
  }

  if(step===0){
    if(song.bloomBars>0)song.bloomBars--;
    if(song.twPleasureReleaseBars>0)song.twPleasureReleaseBars--;
    if(song.ascensionBars>0)song.ascensionBars--;
    if(song.worldCommitBars>0)song.worldCommitBars--;
    if(song.upperSurgeBars>0)song.upperSurgeBars--;
    if(song.miniMusicDebutBars>0){
      song.miniMusicDebutBars--;
      if(song.miniMusicDebutBars<=0)song.miniMusicDebutBit=-1;
    }
    song.upperMixLift=lerp(song.upperMixLift,(song.worldCommitBars>0||song.upperSurgeBars>0)?1:0,.35);
    song.bedBloom=song.bloomBars>0||song.ascensionBars>0||song.worldCommitBars>0;
    // Hidden reward release only on 8-bar boundaries.
    if(bar%8===0 && song.twPleasureCharge>=.68 && song.twPleasureReleaseBars<=0){
      song.twPleasureReleaseBars=4;
      song.twPleasureCharge*=.24;
      song.twPleasureReleases++;
      song.sceneShiftUntil=whenMs+1400;
      song.sceneShiftLabel="RESONANCE";
      eventFlash("RESONANCE",whenMs,1200,.88);
    }

    playAmbientBed(snap,qt,bar16);
    song.chordPulse=1;
  }

  // =========================================================
  // PLAYER LAYER: every action must pass through the quantized governor.
  // =========================================================
  if(step%2===0){
    const absEighth=bar*8 + step/2;
    processGuidedSlot(absEighth,qt);
  }

  // Flow naturally decays; pleasure is sustained by continuous good play.
  song.guidedDensity*=.995;
  if(whenMs-song.guidedFlowAt>2200)song.guidedFlow*=.994;
  song.guidedPleasure=clamp(song.guidedPleasure*.9996 + song.guidedFlow*.0008,0,1);

  // Dynamic mix opens continuously, but no rhythmic part is added.
  if(audioReady){
    const p=clamp(song.guidedPleasure+.10*scoreEmotion(),0,1);
    const bg=TW_BACKDROPS[song.twBackdrop]||TW_BACKDROPS[1];
    const motionOpen=song.twGestureHeight*.700 + song.twGestureEnergy*.400;
    const cutoff=clamp(2100+p*1750+motionOpen*1050+bg.bright*1250,1100,7200);
    filter.frequency.setTargetAtTime(cutoff,AC.currentTime,.16);

    const macro=(song.bloomBars>0?.08:0)+(song.ascensionBars>0?.12:0)+(song.twPleasureReleaseBars>0?.10:0);
    const mastery=masterySpaceBonus();
    const wc=song.worldCommitBars>0?1:0,wm=(song.worldMasteryTier[song.guidedWorld]||0)/5;
    const worldWet=song.guidedWorld===0?-.03:(song.guidedWorld===1?.08:.15),worldCut=song.guidedWorld===0?-520:(song.guidedWorld===1?220:760);
    filter.frequency.setTargetAtTime(clamp(cutoff+worldCut*wc+wm*260,1100,7200),AC.currentTime,.16);
    revGain.gain.setTargetAtTime(.30+p*.18+macro+mastery+worldWet*wc+(bg.wet-1)*.12,AC.currentTime,.30);
    delayFbL.gain.setTargetAtTime(.21+p*.09+macro*.30+mastery*.36+(bg.wet-1)*.08,AC.currentTime,.30);
    delayFbR.gain.setTargetAtTime(.19+p*.08+macro*.27+mastery*.32+(bg.wet-1)*.07,AC.currentTime,.30);
    if(chipBus){
      const inKingdom=(state.mode===MODE.BONUS&&typeof bonusGame!=="undefined"&&bonusGame.stage==="KINGDOM");
      const chipLevel=inKingdom?kingdomChipLevel():0;
      chipBus.gain.setTargetAtTime(inKingdom?(.62+chipLevel*.085):.48,AC.currentTime,.12);
      if(chipLP)chipLP.frequency.setTargetAtTime(4800+chipLevel*900,AC.currentTime,.18);
    }

    if(acidBus){
      const racing=(state.mode===MODE.BONUS&&typeof bonusGame!=="undefined"&&bonusGame.stage==="RACE");
      const rewardAcid=song.acidDriveRewardBars>0&&state.mode===MODE.PLAY;
      const acidTarget=racing?1.28:(rewardAcid?1.06:.88);
      acidBus.gain.setTargetAtTime(acidTarget,AC.currentTime,.08);
      if(acidTone){
        const toneGain=racing?4.4:(rewardAcid?3.6:2.6);
        acidTone.gain.setTargetAtTime(toneGain,AC.currentTime,.10);
      }
    }

    if(airBus){
      const worldAir=(song.guidedWorld===2?.22:(song.guidedWorld===1?.08:0));
      const macroAir=(song.bloomBars>0?.12:0)+(song.ascensionBars>0?.20:0)+(song.twPleasureReleaseBars>0?.10:0);
      airBus.gain.setTargetAtTime(.70+p*.16+worldAir+macroAir,AC.currentTime,.22);
      airShelf.gain.setTargetAtTime(3.6+worldAir*7+macroAir*5,AC.currentTime,.24);
    }
  }

  song.transportScheduledSteps++;
}
function updateComposer(now){
  if(!audioReady||state.mode===MODE.TITLE||!song.started)return;
  if(song.epilogue){updateEpilogue(now);return}
  if(state.mode===MODE.OVER)return;

  const stepMs=60000/song.bpm/4;
  const lookAheadMs=120;

  if(!song.transportStarted){
    // Lock first transport event to the next 16th boundary.
    if(!musicEpoch)musicEpoch=now;
    const elapsed=Math.max(0,now-musicEpoch);
    song.transportNextMs=musicEpoch+Math.ceil(elapsed/stepMs)*stepMs;
    song.transportStep=0;
    song.transportBar=0;
    song.transportStarted=true;
  }

  // If the tab hiccups, NEVER skip musical steps.
  // Schedule all missing grid events until we are 120 ms ahead.
  let guard=0;
  while(song.transportNextMs<=now+lookAheadMs && guard++<64){
    if(song.transportNextMs<now-10)song.transportLateRecoveries++;
    scheduleTransportStep(song.transportStep,song.transportBar,song.transportNextMs);

    song.transportStep++;
    if(song.transportStep>=16){
      song.transportStep=0;
      song.transportBar++;
      song.bar=song.transportBar;
      rebuildRhythm();
    }
    song.transportNextMs+=stepMs;
  }
}

/* ============================================================
   AUDIO v61 — NO SOUND EFFECTS

   There is no FLIP sound, BUMPER sound, LAUNCH sound, etc.
   Every physical contact is interpreted by ONE musical instrument.

      collision X       -> chord tone / scale degree
      collision Y       -> register
      collision energy  -> velocity / brightness
      collision time    -> quantized rhythmic slot
      current bar       -> harmonic field

   Timbre: sine + triangle + very soft odd harmonic.
   Space: deep reverb + alternating L/R pan delay.
   The result should feel like one electronic composition being played
   physically, not a game with music underneath and SE on top.
   ============================================================ */
let AC=null,master=null,filter=null,comp=null;
let dryBus=null,spaceBus=null,drumBus=null,drumComp=null,rev=null,revGain=null;
let subBus=null,bodyBus=null,subComp=null,bodySat=null;

let acidBus=null,acidComp=null,acidTone=null;
let chipBus=null,chipHP=null,chipLP=null,chipComp=null,masterClip=null;
let masterLowShelf=null,masterPresence=null,masterHighShelf=null;
let delayL=null,delayR=null,delayFbL=null,delayFbR=null,delayPanL=null,delayPanR=null,pumpGain=null;
let oscA=null,oscB=null,aGain=null,bGain=null,cvGain=null,sub=null,subGain=null,harm=[];
let audioReady=false,lastClock=0,clockStep=0;

// Everything belongs to one pitch universe.
// Four-bar field: Cmaj9 → Em11 → Am9 → Fmaj9(#11-ish color via B).
const THEORY_SCALE=[0,2,4,5,7,8,9,11,12,14,16,17,19,20,21,23];
const HARMONY=[
  [9,12,16,19,23],   // 0 Am7(add9)
  [5,9,12,16,21],    // 1 Fmaj7(add6)

function musicalImpact(kind,power=.4,x=ball.x,y=ball.y,now=nowMs(),key=""){
  audioStats.collisions++;

  state.tension=clamp(state.tension+.006+power*.012,0,1);

  const k=key||collisionKey(kind,x,y);
  const last=impactGate.get(k)||-1e9;
  if(now-last<42){audioStats.deduped++;return}
  impactGate.set(k,now);
  audioStats.queued++;

  // Physical input becomes high-level musical intention, never arbitrary notes.
  // Velocity / location shape intensity and future timbre, not pitch freedom.
  const speedNorm=clamp(Math.hypot(ball.vx,ball.vy)/1200,0,1);
  const heightNorm=clamp(1-(y-FIELD.top)/Math.max(1,FIELD.bottom-FIELD.top),0,1);
  power=clamp(power*.72+speedNorm*.20+heightNorm*.08,0,1);

  // HIT! must be felt instantly.
  immediateHitResonance(kind,power,x,y,now);
  registerHitMastery(kind,power,now);
  let role=GUIDED_ROLE.TIDE;
  if(kind==="flipper") role=GUIDED_ROLE.PULSE;
  else if(kind==="bumper") role=GUIDED_ROLE.GLASS;
  else if(kind==="sling") role=GUIDED_ROLE.AIR;
  else if(kind==="post") role=GUIDED_ROLE.CHOIR;
  else if(kind==="rail") role=GUIDED_ROLE.TIDE;

  // Locked panels define which intentions the system may expose.
  // Before unlock, unsafe/unavailable gestures collapse back to TIDE.
  if(role>0 && !song.panelUnlocked[role])role=GUIDED_ROLE.TIDE;
  queueGuidedIntent(role,power,now,false);
}

const JUICE={

function juiceVibrate(ms=8){

function juiceParticle(x,y,opt={}){
  if(JUICE.particles.length>180)JUICE.particles.splice(0,JUICE.particles.length-160);
  const a=opt.a??(Math.random()*Math.PI*2),sp=opt.sp??(80+Math.random()*170);
  const life=opt.life??(.28+Math.random()*.28);
  JUICE.particles.push({
    x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life,max:life,
    size:opt.size??(2+Math.random()*3.5),c:opt.c||C.paper,
    grav:opt.grav??120,drag:opt.drag??2.7,square:opt.square??false
  });
}
function juiceBurst(x,y,power=.5,opt={}){
  const n=Math.round((opt.n??8)+power*12);
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+(Math.random()-.5)*.22;
    juiceParticle(x,y,{
      a,sp:(opt.speed??110)*(0.55+Math.random()*.9)*(1+power*.45),
      life:(opt.life??.34)*(0.72+Math.random()*.7),
      size:(opt.size??2.6)*(0.7+Math.random()*.9),
      c:i%3===0?(opt.accent||C.accent):(i%3===1?(opt.cool||C.cool):C.paper),
      grav:opt.grav??100,square:opt.square??false
    });
  }
}
function juiceRing(x,y,power=.5,c=C.accent){
  if(JUICE.rings.length>28)JUICE.rings.shift();
  JUICE.rings.push({x,y,r:8,w:2+power*2,life:.34,max:.34,c,power});
}
function juiceRays(x,y,power=.5,c=C.paper){
  if(JUICE.rays.length>18)JUICE.rays.shift();
  JUICE.rays.push({x,y,life:.22,max:.22,c,power,rot:Math.random()*Math.PI});
}
function juicePop(label,x,y,power=.5,c=C.paper){
  if(!label)return;

function juiceImpact(x,y,power=.5,opt={}){
  power=clamp(power,0,1);
  JUICE.serial++;JUICE.lastAt=nowMs();
  JUICE.shake=Math.max(JUICE.shake,opt.shake??(1.2+power*5.4));
  JUICE.flash=Math.max(JUICE.flash,opt.flash??(.04+power*.16));
  if(opt.warm)JUICE.flashWarm=Math.max(JUICE.flashWarm,power*.18);
  juiceBurst(x,y,power,opt);juiceRing(x,y,power,opt.ring||C.accent);
  if(power>.55||opt.rays)juiceRays(x,y,power,opt.ray||C.paper);
  if(opt.label)juicePop(opt.label,x,y-(opt.labelDy??28),power,opt.text||C.paper);
  if(power>.72)juiceVibrate(opt.vibrate??10);
}
function updateJuice(dt){
  dt=clamp(dt,0,.05);
  JUICE.shake*=Math.pow(.001,dt);
  JUICE.flash*=Math.pow(.0004,dt);
  JUICE.flashWarm*=Math.pow(.0005,dt);
  JUICE.shakeX=(Math.random()*2-1)*JUICE.shake;
  JUICE.shakeY=(Math.random()*2-1)*JUICE.shake*.72;
  for(const p of JUICE.particles){
    p.life-=dt;p.vx*=Math.exp(-p.drag*dt);p.vy*=Math.exp(-p.drag*dt);
    p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  JUICE.particles=JUICE.particles.filter(p=>p.life>0);
  for(const r of JUICE.rings){r.life-=dt;r.r+=dt*(115+r.power*180)}
  JUICE.rings=JUICE.rings.filter(r=>r.life>0);
  for(const r of JUICE.rays){r.life-=dt;r.rot+=dt*1.8}
  JUICE.rays=JUICE.rays.filter(r=>r.life>0);
  for(const p of JUICE.pops){p.life-=dt;p.y+=p.vy*dt;p.vy*=Math.exp(-4*dt)}
  JUICE.pops=JUICE.pops.filter(p=>p.life>0);
}
function drawJuice(){
  ctx.save();
  for(const r of JUICE.rays){
    const a=clamp(r.life/r.max,0,1);ctx.globalAlpha=a*.62;
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
    for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);line(10,0,25+r.power*38,0,r.c,1.2+r.power*1.5)}
    ctx.restore();
  }
  for(const r of JUICE.rings){
    const a=clamp(r.life/r.max,0,1);ctx.globalAlpha=a*.82;
    circle(r.x,r.y,r.r,null,r.c,r.w*a);
  }
  for(const p of JUICE.particles){
    const a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;
    if(p.square)rect(p.x-p.size/2,p.y-p.size/2,p.size,p.size,p.c);
    else circle(p.x,p.y,p.size,p.c);
  }
  for(const p of JUICE.pops){
    const a=clamp(p.life/p.max,0,1),grow=1+(1-a)*.08;
    ctx.globalAlpha=Math.min(1,a*1.4);ctx.save();ctx.translate(p.x,p.y);ctx.scale(grow,grow);

  }

  }
}

function upperShotMouthCross(x0,x1,yLine,pad=12){
  return segmentCrossesYBand(yLine,x0,x1,pad) ||
    (ball.y<yLine+18&&ball.prevY>=yLine-36&&ball.x>=x0-pad&&ball.x<=x1+pad);
}

function physicalUpperGateReturn(kind,now){
  // The ball has genuinely crossed the top gate. Keep its horizontal momentum,
  // reverse only the upward component, and place it just inside the visible field.
  // No Bezier, no scripted route, no velocity overwrite on later frames.
  const speed=Math.hypot(ball.vx,ball.vy);
  const down=clamp(Math.max(300,Math.abs(ball.vy)*.72),300,660);
  let bias=0;
  if(kind==="L")bias=95;
  else if(kind==="R")bias=-95;
  ball.y=166;
  ball.vy=down;
  ball.vx=clamp(ball.vx*.72+bias,-420,420);
  const sp=Math.hypot(ball.vx,ball.vy),cap=state.game==="B"?920:850;
  if(sp>cap){const q=cap/sp;ball.vx*=q;ball.vy*=q}
  state.upperGateCooldownUntil=now+170;
  return true;
}
function upperTopShots(now){
  if(state.screen!==SCREEN.UPPER||ball.phase!==PHASE.FIELD)return false;
  if(now<(state.upperGateCooldownUntil||0))return false;
  if(ball.vy>=0)return false;

  // These are the three REAL openings in the top rail.
  // They no longer overlap DIVE / DRIFT / ASCEND.
  const gateY=158;
  const leftHit=upperShotMouthCross(238,408,gateY,6);
  const centerHit=upperShotMouthCross(432,558,gateY,6);
  const rightHit=upperShotMouthCross(582,752,gateY,6);

  if(centerHit){
    if(state.upperLockLit){
      collectUpperLock(now);
      physicalUpperGateReturn("C",now);
    }else{
      upperShot(1,'CENTER',620,now);
      state.flowPulse=1;
      physicalUpperGateReturn("C",now);
    }
    return true;
  }
  if(leftHit){
    upperShot(0,'L ORBIT',700,now);
    registerUpperLoop('L',now);
    physicalUpperGateReturn("L",now);
    return true;
  }
  if(rightHit){
    upperShot(2,'R ORBIT',700,now);
    registerUpperLoop('R',now);
    physicalUpperGateReturn("R",now);
    return true;
  }

  // Closed portions of the crown are solid even if numerical integration
  // places the center a few pixels above the top rail.
  if(ball.y<138){
    ball.y=142;
    ball.vy=Math.max(260,Math.abs(ball.vy)*.68);
    ball.vx*=.88;
    return true;
  }
  return false;
}
function lowerNoteLanes(now){
  if(state.screen!==SCREEN.LOWER||ball.phase!==PHASE.FIELD)return;
  // A visible five-lane rollover bank. A lane lights only on entry, so one
  // slow passage cannot repeatedly score the same note.
  const y0=492,y1=570,half=50;
  for(let i=0;i<NOTE_LANES.length;i++){
    const q=NOTE_LANES[i];
    const inside=ball.y>y0&&ball.y<y1&&Math.abs(ball.x-q.x)<half;
    if(inside&&!state.noteLaneInside[i]){
      lightHarmonyNote(i,now,`NOTE LANE ${q.n}`);
      addScore(120,now);
    }
    state.noteLaneInside[i]=inside;
  }
}

function laneSensors(now){
  if(state.screen===SCREEN.LOWER){
    if(ball.y<138&&ball.phase===PHASE.FIELD&&ball.vy<0&&ball.x>420&&ball.x<570){
      shot("TRANSFER GATE",900,now);
      const prepared=state.harmonyReady;
      if(prepared){
        state.harmonyReady=false;
        state.cards=[0,0,0,0,0];
        state.upperLoopStreak=1;
        state.upperLoopUntil=now+3200;
        addScore(1200,now);
        eventFlash("HARMONY → FLOW 1",now,900,.7);
      }
      const gateV=Math.max(560,Math.abs(ball.vy));
      const gateX=clamp(ball.x,440,550);
      hardCut(SCREEN.UPPER,"01 / TIMBRE","UP");
      state.upperEntries++;
      state.screenTransitions++;
      state.launchTransferCount++;
      state.upperEntryAt=now;
      state.upperReleaseUntil=0;
      // CENTER UP gate is not the plunger lane. It exits through the LOWER
      // crown and re-enters A FROM ABOVE, preserving the idea of one tall table.
      // v18: upper screen starts as free physics immediately. No scripted entry rail.
      ball.route=null;ball.routeP=null;ball.routeT=0;
      ball.x=prepared?495:610;
      ball.y=170;
      ball.vx=clamp((gateX-495)*.36,-120,120);
      ball.vy=clamp(gateV*.46,300,470);

}
function hardCut(screen,label,dir=""){
  ball.route=null;ball.routeP=null;ball.routeT=0;
  const t=nowMs();
  if(state.lastTransitionAt>=0)state.minTransitionGap=Math.min(state.minTransitionGap,t-state.lastTransitionAt);
  state.lastTransitionAt=t;
  state.screen=screen;
  state.cut=72;                 // visual pulse only; physics no longer freezes
  state.cutText=label;
  state.cutDir=dir;
  state.edgePulse=1;
  state.edgeDir=dir;
}
function skillShot(now){
  if(!state.skillReady)return;
  state.skillReady=false;
  const p=plunger.lastCharge;
  let pts=500,label='SOFT';

  // The small central band is the real skill shot. Full-power is useful but
  // not automatically best, which gives the plunger a reason to be learned.
  if(p>=.58&&p<=.68){
    pts=3000;label='PERFECT';
    state.upperLoopStreak=1;
    state.upperLoopUntil=now+(state.game==="B"?2200:3000);
    ball.x=665;
  }else if(p>.78){
    pts=1400;label='HARD';ball.x=485;
  }else if(p>.36){
    pts=900;label='MID';ball.x=650;
  }else{
    pts=500;label='SOFT';ball.x=770;
  }

  state.lastSkill=pts;
  state.score+=pts;

}
function transitionFromShooter(now){
  if(ball.phase===PHASE.SHOOTER&&ball.y<38){
    const exitSpeed=Math.max(760,Math.abs(ball.vy));
    skillShot(now);
    hardCut(SCREEN.UPPER,"01 / TIMBRE","UP");
    state.upperEntries++;
    state.screenTransitions++;
    state.launchTransferCount++;
    state.upperEntryAt=now;
    state.upperReleaseUntil=0;
    ball.phase=PHASE.FIELD;

    // ONE TALL MACHINE:
    // The shooter remains a straight vertical tube across BOTH screens.
    // The only bend is at the physical top of the machine. The ball climbs
    // the right wall, turns over at the crown, then ENTERS THE PLAYFIELD
    // FROM ABOVE. No diagonal mid-screen hand-off, no mid-field appearance.
    const p=clamp(plunger.lastCharge,.06,1);
    const exitY=170+(p-.5)*32;
    // v18: crown hand-off ends at the top of A, then ordinary physics owns the ball.
    ball.route=null;ball.routeP=null;ball.routeT=0;
    ball.x=740-(p-.5)*120;
    ball.y=170;
    ball.vx=-85-(p-.5)*90;
    ball.vy=clamp(exitSpeed*.34,300,470);
    causeFlash("LAUNCH","UP!",now,650,.65);
    soundEvent("TRANSFER_UP",.45,ball.x);
  }
}
function endOfBallBonus(now){
  // Classic pinball structure: partial progress still has value even when the
  // player does not finish the current objective before draining.
  const notes=state.cards.filter(Boolean).length;
  const clock=state.clockIndex;
  const flow=Math.min(3,state.upperLoopStreak);
  const bonus=notes*240+clock*160+flow*300+state.releaseCycle*900;
  if(bonus>0){
    state.score+=bonus;
    eventFlash(`BONUS ${bonus}`,now,700,.45);
  }
  return bonus;
}
function drain(now){
  if(ball.phase===PHASE.LOST)return;
  if(!state.ballSaveUsed && now<state.ballSaveUntil){
    state.ballSaveUsed=true;
    state.savedRespawn=true;
    state.ballSaveUntil=0;
    ball.phase=PHASE.LOST;
    state.respawnAt=now+550;
    soundEvent("SAVE",.4,ball.x);
    return;
  }
  state.savedRespawn=false;
  endOfBallBonus(now);
  ball.phase=PHASE.LOST;
  if(state.ballStartedAt>=0)state.ballDurations.push(Math.max(0,(now-state.ballStartedAt)/1000));
  state.ballStartedAt=0;
  state.lives--;
  eventFlash("BALL LOST",now,700,.5);
  state.respawnAt=now+850;
  soundEvent("LOST",.5,ball.x);
  if(state.lives<=0){state.mode=MODE.OVER;startEpilogue(now);state.overAt=now;state.respawnAt=0}
}
function updateLowerGeometry(now){
  lowerRails.forEach(r=>{
    const topRail=(r[1]===150&&r[3]===150);
    if(now<state.dropInUntil&&topRail)return;
    staticSegment(...r,.78,0);
  });
  postsLower.forEach(p=>circleCollide(p,.78,0));
  slings.forEach(s=>hitSling(s,now));
  lowerBumpers.forEach(o=>activeBumper(o,now));
  lowerTargets(now);
  lowerNoteLanes(now);
  lowerInlaneSensors(now);

  // Optional C / ARRANGER hole. It is deliberately outside the main required route.
  if(now>=state.bonusCooldownUntil){
    const dh=Math.hypot(ball.x-BONUS_HOLE.x,ball.y-BONUS_HOLE.y);
    if(dh<BONUS_HOLE.r+ball.r*.45){
      enterBonus(now);
      return;
    }
  }

  // Proper lower return channels: outer rail creates OUTLANE,
  // inner rail feeds the ball directly toward each flipper.
  staticSegment(210,610,230,816,.82,0);
  staticSegment(285,615,325,714,.84,0);
  staticSegment(780,610,760,816,.82,0);
  staticSegment(705,615,665,714,.84,0);

  // center stopper / quantize
  if(state.stopper>0)staticSegment(455,806,505,806,.93,120);

  // outlane drains and center drain
  if(ball.y>858){
    if(ball.x<245||ball.x>745|| (ball.x>462&&ball.x<528))drain(now);
  }
  if(ball.y>900)drain(now);
}
function upperBumperCandidate(){
  // PHYSICS IS NEVER COOLDOWN-GATED.
  // A pop bumper stays solid on every simulation substep.  `o.cool` is only
  // used to debounce score/audio/visual reward, never collision.
  let best=null,bestT=Infinity;
  for(const o of upperBumpers){
    const hit=upperCircleContact(o);
    if(!hit)continue;
    const t=hit.inside?0:hit.t;
    if(t<bestT){bestT=t;best=o}
  }
  return best;
}

function updateUpperGeometry(now){
  if(state.upperHoldUntil){
    ball.vx=ball.vy=0;
    releaseUpperHold(now);
    return;
  }

  // Upper play is a high-intensity phase, not a place to farm forever.
  // After 18 seconds without cashing RELEASE, the risk lane drops the ball
  // back to LOWER. MAXIMUM grants a slightly longer 22-second ceiling.
  const upperLimit=now<state.surgeUntil?(state.game==="B"?19000:22000):(state.game==="B"?15000:18000);
  if(state.upperEntryAt&&now-state.upperEntryAt>upperLimit){
    state.upperTimeouts++;
    state.upperLoopStreak=0;state.upperLoopUntil=0;state.upperLastLoopSide="";state.upperLockLit=false;state.upperReleaseUntil=0;
    state.upperExits++;state.screenTransitions++;
    state.upperMaxDwell=Math.max(state.upperMaxDwell,now-state.upperEntryAt);state.upperEntryAt=0;
    eventFlash('RISK DROP',now,700,.55);
    const exitX=clamp(ball.x,230,760);
    const exitVx=ball.vx;
    hardCut(SCREEN.LOWER,'02 / TIME','DOWN');
    state.dropTransferCount++;
    state.dropInUntil=now+260;
    ball.x=exitX;ball.y=164;
    ball.vx=clamp(exitVx*.72,-260,260);ball.vy=470;
    soundEvent('DROP',.42,ball.x);
    return;
  }

  // One bumper owns this substep. This prevents the old double-reflection case
  // where a swept bumper hit and a nearby rail/post both changed velocity.
  const owner=upperBumperCandidate();
  const bumperOwned=owner?activeBumper(owner,now):false;
  if(!bumperOwned){
    upperRails.forEach(r=>staticSegment(...r,.79,0));
    postsUpper.forEach(p=>circleCollide(p,.78,0));

    // v18.1 OPEN UPPER: no hidden inner guide rails.
    // The three top openings plus the three visible pop bumpers define the play.
    staticSegment(205,600,270,700,.77,0);
    staticSegment(785,600,720,700,.77,0);
  }

  upperTopShots(now);

  // The upper level has no drain: missing the upper flippers returns to the lower screen.
  if(ball.y>865){
    state.upperLoopStreak=0;state.upperLoopUntil=0;state.upperLastLoopSide="";state.upperLockLit=false;
    state.upperExits++;
    state.screenTransitions++;
    if(state.upperEntryAt){state.upperMaxDwell=Math.max(state.upperMaxDwell,now-state.upperEntryAt);state.upperEntryAt=0}
    const exitX=clamp(ball.x,220,770);
    const exitVx=ball.vx;
    const exitVy=Math.max(360,Math.abs(ball.vy));
    hardCut(SCREEN.LOWER,"02 / TIME","DOWN");
    state.dropTransferCount++;
    state.dropInUntil=now+260;

    // Same ball, same side, same downward momentum. It appears just below the
    // top edge of LOWER, so the eye reads one continuous fall between screens.
    ball.x=exitX;
    ball.y=164;
    ball.vx=clamp(exitVx*.78,-310,310);
    ball.vy=clamp(exitVy*.88,390,760);
    soundEvent("DROP",.42,ball.x);
  }
}

function updatePhysics(dt,now){
  for(let i=0;i<3;i++)song.upperFxPulse[i]=Math.max(0,song.upperFxPulse[i]-dt*3.6);
  if(state.mode!==MODE.PLAY)return;
  if(state.cut>0)state.cut=Math.max(0,state.cut-dt*1000);
  state.edgePulse=Math.max(0,state.edgePulse-dt*7.5);
  if(ball.phase===PHASE.LOST){
    if(state.respawnAt&&now>=state.respawnAt&&state.lives>0){
      const saved=state.savedRespawn;
      state.respawnAt=0;
      resetBall(!saved);
    }
    return;
  }

  updatePlunger(dt,now);updateFlippers(dt);
  if(ball.phase===PHASE.WAIT)return;

  // v18: no scripted motion exists on the upper playfield.
  // Defensive cleanup for saves created by older builds.
  if(state.screen===SCREEN.UPPER&&ball.route){
    ball.route=null;ball.routeP=null;ball.routeT=0;
  }

  // shooter lane is isolated from main playfield
  if(ball.phase===PHASE.SHOOTER){
    ball.vy+=440*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<824){ball.x=824;ball.vx=Math.abs(ball.vx)*.22}
    if(ball.x>884){ball.x=884;ball.vx=-Math.abs(ball.vx)*.22}
    transitionFromShooter(now);return;
  }

  if(state.cycleResetAt&&now>=state.cycleResetAt){
    state.cycleResetAt=0;state.releaseCycle=0;
    eventFlash("NEXT SET / 3 RELEASES",now,900,.55);
  }
  if(state.stopper>0)state.stopper=Math.max(0,state.stopper-dt*1000);
  state.eventStrength=Math.max(0,state.eventStrength-dt*2.2);
  state.tension=Math.max(0,state.tension-dt*.028);
  if(now>=state.comboUntil){state.combo=0;state.mult=1}
  state.density=lerp(state.density,clamp(state.tension*.42+state.combo*.12+state.cards.filter(Boolean).length*.03+(now<state.surgeUntil?.24:0),0,1),clamp(dt*.9,0,1));
  if(state.screen===SCREEN.UPPER){
    state.upperHeat=Math.max(0,state.upperHeat-dt*.015);
    if(now>state.upperLoopUntil&&!state.upperLockLit)state.upperLoopStreak=0;
    if(state.upperLockLit&&state.upperReleaseUntil&&now>state.upperReleaseUntil){
      state.upperLockLit=false;
      state.upperReleaseUntil=0;
      state.upperLoopStreak=Math.max(1,requiredFlow()-1);
      state.upperLoopUntil=now+(state.game==="B"?1300:1700);
      state.upperHeat=clamp(state.upperHeat+.18,0,1);
      eventFlash('RELEASE MISSED',now,700,.55);
    }
    state.flowPulse=Math.max(0,state.flowPulse-dt*2.6);
  }
  else state.upperHeat=Math.max(0,state.upperHeat-dt*.22);

  ball.prevX=ball.x;ball.prevY=ball.y;
  const baseGravity=state.screen===SCREEN.UPPER?(state.game==="B"?590:545):(state.game==="B"?585:540);
  const gravity=baseGravity*(1+(state.screen===SCREEN.UPPER?state.upperHeat*.07:0));
  ball.vy+=gravity*dt;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  // Mild rolling/air loss. Energy should come primarily from rubbers and flippers.
  ball.vx*=Math.pow(.9989,dt*60);
  ball.vy*=Math.pow(.9990,dt*60);

  if(state.screen===SCREEN.LOWER)updateLowerGeometry(now);else updateUpperGeometry(now);
  laneSensors(now);

  // Upper anti-stall watchdog: human play can expose low-energy pockets that random
  // policies rarely visit. Never permit a stationary ball above the upper flippers.
  if(state.screen===SCREEN.UPPER&&ball.phase===PHASE.FIELD&&ball.y<690&&Math.hypot(ball.vx,ball.vy)<34){
    ball.stall+=dt;
    if(ball.stall>.82){
      ball.vy=Math.max(ball.vy,185);
      ball.vx+=ball.x<FIELD.center?55:-55;
      state.rescueCount++;
      ball.stall=0;
    }
  }

  // Geometry safety: never allow an accidental zero-energy pocket away from the flippers.
  // A real cradle near the flippers is preserved.
  let sp=Math.hypot(ball.vx,ball.vy);
  if(sp<18 && ball.y<690){
    ball.stall+=dt;
    if(ball.stall>1.5){
      ball.vy+=78;
      ball.vx+=(ball.x<FIELD.center?42:-42);
      state.rescueCount++;
      eventFlash("AUTO RESCUE",now,420,.25);
      ball.stall=0;
    }
  }else ball.stall=0;

  sp=Math.hypot(ball.vx,ball.vy);const max=state.game==="B"?1140:1010;
  if(sp>max){const q=max/sp;ball.vx*=q;ball.vy*=q}

}

function nowSave(){return !state.ballSaveUsed && nowMs()<state.ballSaveUntil}

function liveInstrumentState(){
  const x=clamp((ball.x-160)/720,0,1);
  const y=clamp(ball.y/900,0,1);
  const speed=Math.hypot(ball.vx,ball.vy);
  const sc=scales[state.game],pos=x*(sc.length-1),lo=Math.floor(pos),hi=Math.min(sc.length-1,lo+1),frac=pos-lo;
  const semi=state.game==="A"?lerp(sc[lo],sc[hi],frac*.34):lerp(sc[lo],sc[hi],frac);
  const freq=110*Math.pow(2,semi/12);

function drawReactiveBackgroundFX(now=nowMs(),upper=state.screen===SCREEN.UPPER){
  const level=spectacleLevel(now);
  const tier=spectacleTier(now);
  const accent=activeWorldColor();
  const alt=upper?C.cool:C.accent;
  const px=150,py=34,pw=810,ph=866;
  ctx.save();ctx.beginPath();ctx.rect(px,py,pw,ph);ctx.clip();

  // 1) Sequencer bars — always subtle. Density comes from the arrangement itself.
  ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.018+.045*level;
  for(let i=0;i<16;i++){
    const e=stepEnergy(i);if(e<=0&&tier<3)continue;
    const x=px+24+i*((pw-48)/16),h=16+e*30+level*22;
    rect(x,py+ph-h-32,5+e*3,h,i===song.step?accent:(i%2?C.paper:alt));
  }
  ctx.restore();

  // 2) Musical waves — one at the beginning, at most four at full intensity.
  ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.025+.052*level;
  const bands=1+Math.min(3,Math.floor(level*4));
  for(let band=0;band<bands;band++){
    ctx.beginPath();
    for(let sx=0;sx<=pw;sx+=28){
      const xx=px+sx;
      const yy=py+ph*(.79-band*.075)+Math.sin(now*.0012+sx*.014+band*1.4)*(3+level*9);
      if(sx===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
    }
    ctx.strokeStyle=band%2?alt:accent;ctx.lineWidth=.65+level*.75;ctx.stroke();
  }
  ctx.restore();

  // 3) Rings only appear once the song has meaningfully built up.
  if(tier>=2){
    ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.025+.050*level;
    const cy=upper?390:525,ringCount=Math.min(3,tier-1);
    for(let i=0;i<ringCount;i++)circle(495,cy,145+i*72+Math.sin(now*.0012+i)*5,null,i%2?accent:alt,.7+level*.7);
    ctx.restore();
  }

  // 4) Sparse constellation at high intensity. No curtains/tunnels/strobe.
  if(tier>=3){
    ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.025+.045*level;
    const count=6+(tier-3)*5;
    for(let i=0;i<count;i++){
      const xx=px+((i*113+now*.012*(7+i%3))%pw);
      const yy=py+((i*173+Math.sin(now*.0008+i)*55+ph)%ph);
      circle(xx,yy,1.2+(i%3)*.55,i%3===0?accent:(i%3===1?alt:C.paper));
    }
    ctx.restore();
  }

  // 5) Rays are reserved for actual climaxes and are deliberately short/transparent.
  const climax=now<state.surgeUntil||song.ascensionBars>0||song.twPleasureReleaseBars>0||song.emotionPulse>.72;
  if(climax){
    ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=.035+.060*level;
    // Never attach background FX to the ball. The ball must remain a clean physical object.
    const fx=495;
    const fy=upper?390:525;
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5+now*.00018;
      line(fx+Math.cos(a)*28,fy+Math.sin(a)*28,fx+Math.cos(a)*(125+level*90),fy+Math.sin(a)*(125+level*90),i%2?accent:C.paper,.5+level*.65);
    }
    ctx.restore();
  }
  ctx.restore();
}

function bonusMaskFromBlocks(){
  let mask=0;
  bonusGame.blocks.forEach((q,i)=>{if(!q.alive)mask|=(1<<i)});
  return mask>>>0;
}

function buildBreakoutBlocks(mask=0){
  bonusGame.blocks=[];
  const x0=270,y0=205,bw=70,bh=34,gx=16,gy=14;
  for(let r=0;r<BREAKOUT_ROWS;r++){
    for(let c=0;c<BREAKOUT_COLS;c++){
      const i=r*BREAKOUT_COLS+c;
      bonusGame.blocks.push({
        x:x0+c*(bw+gx),y:y0+r*(bh+gy),
        w:bw,h:bh,alive:!(mask&(1<<i)),row:r,col:c
      });
    }
  }
  bonusGame.broken=bonusGame.blocks.filter(q=>!q.alive).length;
}

    combo:0,comboPeak:0,checkpoints:0,cleared:false,failed:false
  });

  // CHECKPOINT RESUME:
  // BREAKOUT partial progress -> exact block mask
  // REWARD -> no need to replay breakout
  // RACE -> no need to replay breakout or phrase item
  const validStages=new Set(["BREAKOUT","REWARD","RACE","KINGDOM"]);
  let savedStage=miniSave.stage||"BREAKOUT";
  if(!validStages.has(savedStage)){
    savedStage=miniSave.kingdomUnlocked?"KINGDOM":
               miniSave.raceUnlocked?"RACE":
               miniSave.breakoutCleared?"REWARD":"BREAKOUT";
    miniSave.stage=savedStage;
    writeMiniSave();
  }

  if(savedStage==="KINGDOM"||miniSave.kingdomUnlocked){
    buildBreakoutBlocks((1<<24)-1);
    bonusGame.stage="KINGDOM";
  }else if(savedStage==="RACE"||miniSave.raceUnlocked){
    buildBreakoutBlocks((1<<24)-1);

    buildBreakoutBlocks((1<<24)-1);

    bonusGame.reward.spawnAt=now;
  }else{
    buildBreakoutBlocks(miniSave.brokenMask>>>0);
    bonusGame.stage="BREAKOUT";
  }
}

function registerBreakoutBlockHit(block,now){
  if(!block.alive)return;
  block.alive=false;bonusGame.broken++;song.drumBuildBlocks++;

  if(now-bonusGame.lastBlockAt<1450)bonusGame.combo++;else bonusGame.combo=1;
  bonusGame.comboPeak=Math.max(bonusGame.comboPeak,bonusGame.combo);
  bonusGame.lastBlockAt=now;

  const earned=breakoutLevelForBroken(bonusGame.broken);
  if(earned>song.drumBuildPending){
    song.drumBuildPending=earned;song.drumBuildMax=Math.max(song.drumBuildMax,earned);
    song.sceneShiftUntil=now+1150;song.sceneShiftLabel=`NEXT BAR / ${breakoutPartName(earned)}`;
    eventFlash(`${breakoutPartName(earned)} READY`,now,900,.82);
    causeFlash(`${bonusGame.broken}/24 BLOCKS`,`NEXT BAR → ${breakoutPartName(earned)}`,now,1050,.82);
    song.twPleasureCharge=clamp(song.twPleasureCharge+.10,0,1);
  }else eventFlash(`BREAK ${bonusGame.broken}/24`,now,260,.32);

  if(audioReady){
    const snap=snapshotChord(),degree=(block.col+block.row)%5;
    ambientGlassSemi(chordTone(degree,2+(block.row===0?1:0),snap),
      .024+.004*block.row,.12,
      clamp((block.col-(BREAKOUT_COLS-1)/2)*.16,-.65,.65),now,.64);
  }

  addScore(420+bonusGame.combo*24,now);

  const blockPower=clamp(.38+bonusGame.combo*.035,0,.78);
  juiceReward("break",block.x,block.y,blockPower,bonusGame.combo>=4?`×${bonusGame.combo}`:"");
  if(bonusGame.broken%4===0){
    juiceReward("power",block.x,block.y,.82,breakoutPartName(breakoutLevelForBroken(bonusGame.broken)));
  }
  if(bonusGame.combo>=6){
    bonusGame.feverUntil=Math.max(bonusGame.feverUntil,now+2600);
    if(bonusGame.combo===6)juiceReward("power",block.x,block.y,.78,"FEVER");
  }

  // Save every destroyed block: exact partial resume.
  miniSave.brokenMask=bonusMaskFromBlocks();
  miniSave.drumBuild=Math.max(miniSave.drumBuild|0,earned);
  saveMiniCheckpoint("BREAKOUT");

  if(bonusGame.broken>=BREAKOUT_TOTAL){
    song.drumBuildPending=6;song.drumBuildClears++;
    miniSave.drumBuild=6;
    if(ARCADE15.active==="BREAKOUT"){
      juiceReward("power",495,330,1,"FULL GROOVE");
      arcadeFinish("BREAKOUT",now,"FULL GROOVE");
      return;
    }
    enterRewardDrop(now);
  }
}

  // Fallback transition makes the race unavoidable even if transport scheduling hiccups.
  const barMs=60000/song.bpm*4;

function updateRewardDrop(dt,now){
  const r=bonusGame.reward;
  const dir=(rightDown?1:0)-(leftDown?1:0);
  const fever=now<bonusGame.feverUntil;
  bonusGame.paddleW=lerp(bonusGame.paddleW,fever?178:142,clamp(dt*7,0,1));
  bonusGame.paddleV=lerp(bonusGame.paddleV,dir*(fever?700:640),clamp(dt*14,0,1));
  bonusGame.paddleX=clamp(bonusGame.paddleX+bonusGame.paddleV*dt,235,755);

  r.pulse+=dt*5.2;
  r.vy=Math.min(235,r.vy+54*dt);
  r.y+=r.vy*dt;

  // generous magnetic catch zone: reward should feel earned, not annoying.
  const dx=bonusGame.paddleX-r.x;
  if(r.y>650&&Math.abs(dx)<150){
    r.x+=dx*dt*2.8;
    r.magnet=clamp(r.magnet+dt*2.2,0,1);
  }

  const catchY=bonusGame.paddleY-26;
  if(r.y+r.h*.5>=catchY &&
     Math.abs(r.x-bonusGame.paddleX)<bonusGame.paddleW*.62+r.w*.32){
    catchPhraseChip(now);
    return;
  }

  // Missed item respawns. No punishment after clearing 24 blocks.
  if(r.y>860){
    r.x=350+guidedHash(Math.floor(now),bonusGame.broken,77)%290;
    r.y=145;r.vy=105;r.magnet=0;
    eventFlash("PHRASE CHIP / AGAIN",now,450,.45);
  }
}

function updateRaceRewards(dt,now){
  const r=bonusGame.race;

  for(const g of r.gates){
    g.y+=r.speed*dt;

    if(!g.passed && g.y>=r.carY){
      const inside=Math.abs(r.carX-g.x)<g.w*.42;
      if(inside){
        g.passed=true;
        song.raceGateHits++;
        song.raceGrooveCombo++;
        const expected=r.phrase[r.phraseIndex%r.phrase.length];
        if(g.lane===expected){
          r.phraseIndex++;
          r.phraseHits++;
          juiceReward("item",g.x,r.carY,.66,`PHRASE ${r.phraseIndex}/4`);
          if(r.phraseIndex>=4){
            r.phraseIndex=0;
            r.phrase=[(r.phrase[1]+1)%3,(r.phrase[2]+2)%3,(r.phrase[3]+1)%3,(r.phrase[0]+2)%3];
            song.raceBoostUntil=now+2600;
            juiceReward("power",r.carX,r.carY,.9,"ACID PHRASE");
          }
        }
        song.raceGroovePeak=Math.max(song.raceGroovePeak,song.raceGrooveCombo);
        song.raceHeat=clamp(song.raceHeat+.10,0,1);
        eventFlash(`GROOVE GATE ×${song.raceGrooveCombo}`,now,360,.48);
        juiceReward("micro",g.x,r.carY,.52,`GATE ×${song.raceGrooveCombo}`);

        if(song.raceGrooveCombo>0 && song.raceGrooveCombo%4===0){
          song.racePerfectLines++;
          song.raceBoostUntil=now+1800;
          eventFlash("PERFECT LINE / BOOST",now,620,.72);
          juiceReward("power",r.carX,r.carY,.86,"PERFECT LINE");
        }
      }else{
        g.missed=true;
        song.raceGateMisses++;
        song.raceGrooveCombo=0;
      }
    }
  }
  r.gates=r.gates.filter(g=>g.y<900);

  for(const p of r.pickups){
    p.phase+=dt*5;
    p.y+=r.speed*.92*dt;

    if(!p.taken && Math.hypot(r.carX-p.x,r.carY-p.y)<42){
      p.taken=true;
      song.racePickupCount++;
      song.raceBoostUntil=now+2400;
      song.twPleasureCharge=clamp(song.twPleasureCharge+.08,0,1);
      eventFlash("ACID CELL / BOOST",now,520,.62);
      juiceReward("item",p.x,p.y,.78,"ACID CELL");
    }
  }
  r.pickups=r.pickups.filter(p=>!p.taken&&p.y<900);
}

}

function updateRace(dt,now){
  const r=bonusGame.race;if(!r.started)return;
  // Freeze guard: browser hitch must never explode movement/spawn calculations.
  dt=clamp(dt,0,1/20);
  const dir=(rightDown?1:0)-(leftDown?1:0);

  const desired=dir*560;
  r.carV=lerp(r.carV,desired,clamp(dt*12,0,1));

  if(dir!==0){
    // Immediate control intent + actual velocity.
    // This ensures the very next 16th reflects the player's movement.
    const velocityPart=clamp(Math.abs(r.carV)/560,0,1);
    const intensity=clamp(.42+.58*velocityPart,0,1);
    raceSteerMusicalIntent(dir,intensity,now);
  }
  r.carX=clamp(r.carX+r.carV*dt,r.roadLeft+34,r.roadRight-34);

  // Explicit physical goal: 2000 m.
  // Speed converts directly into visible meter progress.
  const roughProgress=clamp(r.distanceM/r.targetM,0,1);
  r.speed=330+roughProgress*210+song.bonusTier*18;

  // Tune so a clean run is ~16 bars at 122 BPM, but the player sees meters, not bars.
  const metersPerSec=48+roughProgress*8;
  r.distanceM=Math.min(r.targetM,r.distanceM+metersPerSec*dt);
  r.distance=clamp(r.distanceM/r.targetM,0,1);

  song.raceBestDistance=Math.max(song.raceBestDistance,r.distance);
  miniSave.bestDistance=Math.max(+miniSave.bestDistance||0,r.distance);

  raceSpawnPending(now);
  updateRaceRewards(dt,now);

  for(const o of r.obstacles){
    o.y+=r.speed*o.speedMul*dt;

    if(!o.passed&&o.y>r.carY+80){
      o.passed=true;r.combo++;r.comboPeak=Math.max(r.comboPeak,r.combo);
      addScore(260+r.combo*14,now);
    }

    if(!o.nearChecked&&o.y>r.carY-8){
      o.nearChecked=true;
      const gap=Math.abs(o.x-r.carX);
      if(gap>(o.w+r.carW)*.5&&gap<(o.w+r.carW)*.5+42){
        r.nearMisses++;song.raceNearMisses++;
        r.nearBoostUntil=now+900;
        song.raceBoostUntil=Math.max(song.raceBoostUntil,now+900);
        song.raceGrooveCombo++;
        song.raceGroovePeak=Math.max(song.raceGroovePeak,song.raceGrooveCombo);
        song.twPleasureCharge=clamp(song.twPleasureCharge+.035,0,1);
        eventFlash(`NEAR ${r.nearMisses}`,now,300,.35);
        juiceReward("micro",r.carX,r.carY,.48,"NEAR");
      }
    }

    if(now>=r.invulnUntil&&raceRectOverlap(r.carX,r.carY,r.carW,r.carH,o.x,o.y,o.w,o.h)){
      r.lives--;r.crashes++;song.raceCrashes++;
      r.invulnUntil=now+900;r.combo=0;song.raceGrooveCombo=0;song.raceHeat*=.45;o.passed=true;o.y=940;
      eventFlash(`CRASH / SHIELD ${r.lives}`,now,720,.78);
      juiceImpact(r.carX,r.carY,.88,{n:20,speed:170,life:.38,size:3.4,shake:7,flash:.12,
        accent:C.paper,cool:C.muted,ring:C.paper,rays:true,label:"CRASH",text:C.paper});

      if(r.lives<=0){
        r.failed=true;song.raceFails++;
        snapshotCurrentStageProgress("RACE FAIL");
        leaveBonus(now,false);
        return;
      }
    }
  }

  r.obstacles=r.obstacles.filter(o=>o.y<930);
  const cp=Math.min(4,Math.floor(r.distanceM/500));
  if(cp>r.checkpoints&&cp<4){
    r.checkpoints=cp;
    miniSave.raceResume={
      distanceM:r.distanceM,checkpoints:r.checkpoints,combo:r.combo,
      nearMisses:r.nearMisses,crashes:r.crashes
    };
    writeMiniSave("RACE CHECKPOINT");
    eventFlash(`CHECKPOINT ${cp} / ${cp*500}m`,now,850,.72);
  }

  if(r.distanceM>=r.targetM){
    r.cleared=true;song.raceClears++;song.raceBestDistance=1;
    song.acidDriveUnlocked=1;
    song.acidDriveRewardBars=Math.max(song.acidDriveRewardBars,8);
    song.bonusChapterClears++;
    song.bonusTier=Math.min(6,song.bonusTier+1);

    if(r.crashes===0){
      song.bonusPerfects++;
      song.twPleasureCharge=1;
    }

    miniSave.raceCleared=true;
    miniSave.raceResume={distanceM:0,checkpoints:0,combo:0,nearMisses:0,crashes:0};
    miniSave.kingdomUnlocked=true;
    miniSave.stage="KINGDOM";
    miniSave.bonusTier=song.bonusTier;
    miniSave.bestDistance=1;
    miniSave.perfects=song.bonusPerfects;
    miniSave.clears=song.bonusChapterClears;
    miniSave.drumBuild=6;
    writeMiniSave();

    if(ARCADE15.active==="DRIVE"){
      r.started=false;
      arcadeFinish("DRIVE",now,"FINISH 2000m");
      return;
    }
    song.kingdomUnlocked=1;
    r.started=false;
    startKingdomStage(now);
    return;
  }
}

function updateKingdom(dt,now){
  const k=bonusGame.kingdom,p=k.player;
  if(!k.started)return;

  const dir=(rightDown?1:0)-(leftDown?1:0);
  const accel=p.onGround?980:520,maxSpd=p.onGround?365:325;

  // Jump buffer: a slightly early press is remembered.
  if(bonusJumpPressed)p.jumpBuffer=.105;
  bonusJumpPressed=false;
  p.jumpBuffer=Math.max(0,p.jumpBuffer-dt);

  // Coyote time: a slightly late press after leaving an edge still jumps.
  if(p.onGround)p.coyote=.090;
  else p.coyote=Math.max(0,p.coyote-dt);

  // Skid is intentionally strong when reversing direction.
  const reversing=dir!==0&&Math.sign(p.vx)!==0&&Math.sign(p.vx)!==dir&&Math.abs(p.vx)>80;
  p.skid=reversing?clamp(p.skid+dt*5,0,1):Math.max(0,p.skid-dt*4);

  if(dir){
    const a=reversing?accel*1.32:accel;
    p.vx+=dir*a*dt;p.facing=dir;
  }else{
    const fr=p.onGround?900:135;
    if(Math.abs(p.vx)<=fr*dt)p.vx=0;else p.vx-=Math.sign(p.vx)*fr*dt;
  }
  p.vx=clamp(p.vx,-maxSpd,maxSpd);

  if(p.jumpBuffer>0&&p.coyote>0){
    const speedLift=clamp(Math.abs(p.vx)/maxSpd,0,1);
    p.vy=-(500+76*speedLift);
    p.onGround=false;p.coyote=0;p.jumpBuffer=0;p.jumpCut=false;p.state="JUMP";
    kingdomEvent("JUMP",p.x,now);
    juiceReward("micro",p.x-k.camX,p.y,.30,"");
  }

  const prevY=p.y;

  // Variable jump height: holding SPACE sustains rise; releasing cuts it short.
  const rising=p.vy<0;
  const grav=(rising&&bonusJumpDown&&!p.jumpCut)?770:(rising?1390:1120);
  if(rising&&!bonusJumpDown)p.jumpCut=true;
  p.vy+=grav*dt;p.vy=Math.min(p.vy,760);
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,18,k.worldW-18);p.onGround=false;
  if(p.vy>0)p.state="FALL";

  for(const q of k.platforms){
    if(!q.active)continue;
    q.prevX=q.x;
    if(q.type==="MOVE")q.x=q.baseX+Math.sin(now*.0011)*q.range;
    else if(q.type==="DROP"&&q.fallV>0){q.fallV+=650*dt;q.y+=q.fallV*dt}
    q.dx=q.x-q.prevX;

    if(kingdomLandOnPlatform(p,q,prevY)){
      p.y=q.y-q.h/2-p.h/2;
      if(p.vy>230&&now-k.lastLandAt>180)kingdomEvent("STOMP",p.x,now);
      p.vy=0;p.onGround=true;p.state="GROUND";k.lastLandAt=now;
      if(q.type==="MOVE")p.x+=q.dx;
      if(q.type==="DROP"&&q.fallV===0)q.fallV=1;
    }
  }

  for(const b of k.blocks){
    b.bounce*=Math.pow(.01,dt);
    const y=b.y-b.bounce*8;
    if(p.vy<0&&p.x+p.w*.38>b.x-b.w/2&&p.x-p.w*.38<b.x+b.w/2&&
       prevY-p.h/2>=y+b.h/2-12&&p.y-p.h/2<=y+b.h/2){
      p.y=y+b.h/2+p.h/2;p.vy=80;kingdomHitBlock(b,now);
    }
  }

  for(const s of k.springs){
    s.cool=Math.max(0,s.cool-dt);s.phase=Math.max(0,s.phase-dt*4);
    if(s.cool<=0&&p.vy>=0&&Math.abs(p.x-s.x)<(p.w+s.w)*.45&&p.y+p.h/2>=s.y-10&&p.y+p.h/2<=s.y+20){
      p.y=s.y-p.h/2-8;p.vy=-720;p.onGround=false;p.state="JUMP";s.cool=.45;s.phase=1;
      song.kingdomSprings++;kingdomEvent("SPRING",s.x,now);eventFlash("SPRING / OCTAVE!",now,360,.48);
      juiceReward("item",s.x-k.camX,s.y,.70,"OCTAVE!");
    }
  }

  for(const it of k.items){
    it.age+=dt;
    if(it.state==="FLOAT"){
      it.phase=(it.phase||0)+dt*2.4;
      it.y=(it.baseY||it.y)+Math.sin(it.phase)*8;
    }else if(it.state==="RISE"){
      it.y-=54*dt;
      if(it.age>.48){it.state="MOVE";it.vy=0}
    }else{
      const prev=it.y;it.vy+=760*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;
      for(const q of k.platforms){
        if(kingdomLandOnPlatform(it,q,prev)){it.y=q.y-q.h/2-it.h/2;it.vy=0;break}
      }
    }
    if(!it.taken&&rectOverlap(p,it))kingdomTakeItem(it,now);
  }
  k.items=k.items.filter(it=>!it.taken&&it.y<900);

  for(const e of k.enemies){
    if(!e.alive)continue;
    if(e.type==="HOPPER"&&e.onGround&&((Math.floor(now/900)+Math.floor(e.x))%4===0))e.vy=-370;
    const ep=e.y;e.vy+=960*dt;e.vy=Math.min(e.vy,650);e.x+=e.vx*dt;e.y+=e.vy*dt;e.onGround=false;
    for(const q of k.platforms){
      if(kingdomLandOnPlatform(e,q,ep)){e.y=q.y-q.h/2-e.h/2;e.vy=0;e.onGround=true}
    }

    // Walkers turn around at island edges instead of suiciding immediately.
    if(e.onGround&&e.type==="WALKER"){
      const ahead=e.x+Math.sign(e.vx)*26;
      const hasFloor=k.platforms.some(q=>
        q.active &&
        ahead>q.x-q.w/2 && ahead<q.x+q.w/2 &&
        Math.abs((e.y+e.h/2)-(q.y-q.h/2))<18
      );
      if(!hasFloor)e.vx*=-1;
    }

    if(!rectOverlap(p,e))continue;
    const stomp=p.vy>100&&prevY+p.h/2<=e.y-e.h*.18;
    if(stomp){
      e.alive=false;p.vy=-330;song.kingdomEnemies++;k.combo++;kingdomEvent("STOMP",e.x,now);addScore(1100+k.combo*120,now);
      juiceReward("snap",e.x-k.camX,e.y,.78,k.combo>1?`STOMP ×${k.combo}`:"STOMP");
    }else if(now>=p.invulnUntil){
      song.kingdomDeaths++;k.deaths++;eventFlash("PULSE DOWN / CHECKPOINT",now,700,.72);kingdomRespawn(now);return;
    }
  }

  const cp=p.x>3350?3:p.x>2700?2:p.x>1400?1:0;
  if(cp>k.checkpoint){
    k.checkpoint=cp;k.spawnX=[180,1450,2780,3420][cp];k.spawnY=650;
    song.kingdomBestCheckpoint=Math.max(song.kingdomBestCheckpoint,cp);
    miniSave.kingdomCheckpoint=cp;writeMiniSave();eventFlash(`CHECKPOINT ${cp}/3`,now,700,.65);
    juiceReward("power",p.x-k.camX,p.y,.78,`CHECKPOINT ${cp}`);
  }

  k.camX=lerp(k.camX,clamp(p.x-360,0,k.worldW-960),clamp(dt*5.5,0,1));

  if(p.y>900){song.kingdomDeaths++;k.deaths++;kingdomRespawn(now)}
  if(p.x>k.goalX&&p.y<720)finishKingdom(now);
}

function finishKingdom(now){
  const k=bonusGame.kingdom;if(!k.started)return;k.started=false;
  song.kingdomClears++;song.kingdomUnlocked=1;song.kingdomRewardBars=12;song.bonusChapterClears++;
  kingdomEvent("GOAL",k.goalX,now);
  juiceReward("power",k.goalX-k.camX,k.goalY,1,k.deaths===0?"PERFECT CLEAR":"KINGDOM CLEAR");

  if(k.deaths===0){song.kingdomPerfects++;song.twPleasureCharge=1;eventFlash("PULSE KINGDOM / PERFECT",now,1300,1)}

  if(ARCADE15.active==="KINGDOM"){
    arcadeFinish("KINGDOM",now,k.deaths===0?"PERFECT":"CHIP CLEAR");

  }

  miniSave.raceCleared=true;miniSave.kingdomUnlocked=false;miniSave.kingdomCheckpoint=0;miniSave.kingdomCleared=true;

}
