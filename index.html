function storyAllClear(){return (miniSave.storyStage|0)>=STORY_STAGES.length}
function currentStoryDef(){
  const idx=storyAllClear()
    ? ((miniSave.encoreIndex|0)%STORY_STAGES.length)
    : clamp(miniSave.storyStage|0,0,STORY_STAGES.length-1);
  return STORY_STAGES[idx];
}
function storyProgressText(){
  if(storyAllClear())return `ALL STAGES CLEAR · ENCORE ${(miniSave.encoreIndex|0)+1}`;
  return `STAGE ${(miniSave.storyStage|0)+1} / ${STORY_STAGES.length}`;
}

const MINI_MUSIC_ROLE_INDEX=Object.fromEntries(STORY_STAGES.map((d,i)=>[d.id,i]));

function miniMusicBit(id){
  const i=MINI_MUSIC_ROLE_INDEX[id];
  return Number.isInteger(i)?i:-1;
}
function miniMusicHas(id){
  const bit=miniMusicBit(id);
  return bit>=0 && !!((song.miniMusicMask|0)&(1<<bit));
}
function miniMusicCount(){
  let n=0,m=(song.miniMusicMask|0)&0x3ff;
  while(m){n+=m&1;m>>>=1}
  return n;
}
function miniMusicDebutGain(id){
  const bit=miniMusicBit(id);
  return song.miniMusicDebutBars>0&&song.miniMusicDebutBit===bit?1.55:1;
}
function unlockMiniMusicRole(id,now){
  const bit=miniMusicBit(id);
  if(bit<0)return;
  const def=STORY_STAGES[bit];
  const flag=1<<bit;
  const wasOn=!!((miniSave.musicMask|0)&flag);
  miniSave.musicMask=((miniSave.musicMask|0)|flag)&0x3ff;
  miniSave.lastMusicRole=def.music||id;
  song.miniMusicMask=miniSave.musicMask;
  song.miniMusicDebutBit=bit;
  song.miniMusicDebutBars=8;
  song.musicGetUntil=now+9200;
  song.musicGetTitle=wasOn?"MUSIC BOOST":"MUSIC GET";
  song.musicGetRole=def.music||id;
  song.musicGetText=def.musicText||"曲のアレンジが変化した";
  song.sceneShiftUntil=now+4200;
  song.sceneShiftLabel=`${song.musicGetTitle} / ${song.musicGetRole}`;
  song.twPleasureCharge=clamp(song.twPleasureCharge+.26,0,1);

  // Existing signature layers get an immediate debut window too.
  if(id==="DRIVE")song.acidDriveRewardBars=Math.max(song.acidDriveRewardBars,8);
  if(id==="KINGDOM")song.kingdomRewardBars=Math.max(song.kingdomRewardBars,8);

  writeMiniSave("MUSIC ROLE");
}

function scheduleMiniGameMusicLayers(step,bar,whenMs,snap){
  if(state.mode!==MODE.PLAY)return;

  // 4 / UFOシューティング -> LEAD MELODY
  if(miniMusicHas("SHOOTER") && bar%2===0){
    const seq={0:0,3:2,6:4,10:3,14:4};
    if(Object.prototype.hasOwnProperty.call(seq,step)){
      const d=seq[step],boost=miniMusicDebutGain("SHOOTER");
      ambientGlassSemi(chordTone(d,4,snap),.115*boost,.22,(step<8?-.24:.24),whenMs,.82);
      warmVoiceSemi(chordTone(d,3,snap),.030*boost,.27,(step<8?-.12:.12),-.08,whenMs);
    }
  }

  // 5 / カラー落ちもの -> CHORD PAD
  if(miniMusicHas("DROP") && step===0){
    const boost=miniMusicDebutGain("DROP");
    [0,2,4].forEach((d,i)=>
      warmVoiceSemi(chordTone(d,2+(i===2?1:0),snap),.030*boost,1.55,(i-1)*.26,-.16,whenMs+i*18)
    );
  }

  // 6 / もぐらたたき -> PERCUSSION
  if(miniMusicHas("MOLE")){
    const boost=miniMusicDebutGain("MOLE");
    if(step===3||step===11)drumPerc(.44*boost,whenMs,step===3?-.26:.26);
    if(step===7||step===15)drumClap(.28*boost,whenMs);
  }

  // 7 / ホームラン競争 -> BASSLINE
  if(miniMusicHas("HOMERUN")){
    const bassMap={0:0,3:0,6:2,8:4,11:3,14:2};
    if(Object.prototype.hasOwnProperty.call(bassMap,step)){
      const d=bassMap[step],boost=miniMusicDebutGain("HOMERUN");
      mellowBodyBass(chordTone(d,-2,snap),(.48+(step===0?.10:0))*boost,whenMs,.27,step<8?-.06:.06);
      if((step===0||step===8)&&boost>1)deepSubHit(43,.20*boost,whenMs,.26);
    }
  }

  // 8 / 金魚すくい -> SHIMMER
  if(miniMusicHas("GOLDFISH") && (step===2||step===6||step===10||step===14)){
    const d=[4,2,3,4][(step-2)/4|0],boost=miniMusicDebutGain("GOLDFISH");
    ambientGlassSemi(chordTone(d,5,snap),.082*boost,.32,step<8?-.38:.38,whenMs,.95);
    airShimmer(chordTone(d,5,snap),.095*boost,whenMs,.42,step<8?-.28:.28);
  }

  // 9 / クレーンゲーム -> HOOK MELODY
  if(miniMusicHas("CRANE")){
    const local=bar%2*16+step;
    const hook={0:[0,3],4:[2,3],7:[4,3],10:[2,3],14:[3,4],18:[4,3],22:[2,3],27:[1,3],30:[0,4]};
    if(hook[local]){
      const [d,oct]=hook[local],boost=miniMusicDebutGain("CRANE");
      chipPulse(chordTone(d,oct,snap),.50*boost,whenMs,.10,(local<16?-.20:.20),.90);
      warmVoiceSemi(chordTone(d,oct-1,snap),.018*boost,.30,0,-.06,whenMs);
    }
  }

  // 10 / だるま落とし -> BREAK FILLS / final arrangement punctuation
  if(miniMusicHas("DARUMA")){
    const boost=miniMusicDebutGain("DARUMA");
    const debut=boost>1;
    const fillBar=(bar%4===3)||(debut&&bar%2===1);
    if(fillBar){
      // The last half of the bar visibly "falls apart" and rebuilds like the toy.
      if(step===8)drumOpenHat(.56*boost,whenMs,-.16);
      if(step===10)drumClap(.34*boost,whenMs);
      if(step===12){drumPerc(.42*boost,whenMs,-.22);chipNoise(.12*boost,whenMs,.020,.20);}
      if(step===13)drumClap(.38*boost,whenMs);
      if(step===14){drumOpenHat(.72*boost,whenMs,.18);drumPerc(.48*boost,whenMs,-.18);}
      if(step===15){
        drumClap(.58*boost,whenMs);
        chipNoise(.24*boost,whenMs,.045,.28);
      }
    }else if(step===14){
      // Tiny preview on ordinary bars, so the permanent unlock remains audible.
      drumOpenHat(.38*boost,whenMs,.10);
    }
  }
}

// Save the live state BEFORE a failed bonus returns to the C gate.
// C gate retries are resumes, never implicit NEW GAME operations.
function snapshotCurrentStageProgress(reason="FAIL RETURN"){
  const id=ARCADE15.active||currentStoryDef()?.id;
  if(!id)return;

  miniSave.lastStageId=id;

  if(id==="BREAKOUT"){
    miniSave.brokenMask=bonusMaskFromBlocks();
    miniSave.stage="BREAKOUT";
  }else if(id==="DRIVE"){
    const r=bonusGame.race;
    if(r){
      miniSave.raceResume={
        distanceM:clamp(+r.distanceM||0,0,r.targetM||2000),
        checkpoints:clamp(r.checkpoints|0,0,3),
        combo:Math.max(0,r.combo|0),
        nearMisses:Math.max(0,r.nearMisses|0),
        crashes:Math.max(0,r.crashes|0)
      };
      miniSave.bestDistance=Math.max(+miniSave.bestDistance||0,clamp((+r.distanceM||0)/(r.targetM||2000),0,1));
    }
    miniSave.raceUnlocked=true;
    miniSave.stage="RACE";
  }else if(id==="KINGDOM"){
    const k=bonusGame.kingdom;
    miniSave.kingdomCheckpoint=clamp((k?.checkpoint ?? miniSave.kingdomCheckpoint)|0,0,3);
    miniSave.kingdomUnlocked=true;
    miniSave.stage="KINGDOM";
  }else if(id==="STATIC"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("STATIC",{
      lines:clamp(g.lines|0,0,5),
      board:Array.isArray(g.board)?g.board.map(row=>row.slice(0,10)):null
    },reason);
    return;
  }else if(id==="SHOOTER"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("SHOOTER",{
      kills:Math.max(0,g.kills|0),
      bestCombo:Math.max(0,g.bestCombo|0)
    },reason);
    return;
  }else if(id==="CLIMBER"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("CLIMBER",{
      height:clamp(+g.height||0,0,1799),
      checkpoint:clamp(+g.checkpoint||0,0,1200),
      combo:Math.max(0,g.combo|0),
      bestCombo:Math.max(0,g.bestCombo|0),
      fallCount:Math.max(0,g.fallCount|0)
    },reason);
    return;
  }else if(id==="DROP"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("DROP",{cleared:g.cleared|0,bestChain:g.bestChain|0},reason);
    return;
  }else if(id==="MOLE"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("MOLE",{hits:g.hits|0,bestCombo:g.bestCombo|0},reason);
    return;
  }else if(id==="HOMERUN"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("HOMERUN",{homeRuns:g.homeRuns|0,bestDistance:g.bestDistance|0},reason);
    return;
  }else if(id==="GOLDFISH"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("GOLDFISH",{caught:g.caught|0,bestCombo:g.bestCombo|0},reason);
    return;
  }else if(id==="CRANE"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("CRANE",{caught:g.caught|0,tries:g.tries|0},reason);
    return;
  }else if(id==="DARUMA"){
    const g=ARCADE15.g;
    if(g)setArcadeCheckpoint("DARUMA",{
      removed:clamp(g.removed|0,0,6),
      bestCombo:Math.max(0,g.bestCombo|0),
      perfectTotal:Math.max(0,g.perfectTotal|0)
    },reason);
    return;
  }

  writeMiniSave(reason);
}

  const def=currentStoryDef();

  miniSave.gameMode=state.game||miniSave.gameMode||"A";
  writeMiniSave("STAGE START");

  storyIntroSub=def.controls||"A / D + SPACE";

    const mask=miniSave.brokenMask>>>0;
    buildBreakoutBlocks(mask);
    bonusGame.combo=0;bonusGame.comboPeak=0;

    bonusGame.paddleX=495;bonusGame.paddleV=0;bonusGame.paddleW=142;

}

function storyAdvance(id,now){
  const completed=STORY_STAGES.findIndex(s=>s.id===id);
  if(completed<0)return;

  if(!storyAllClear() && completed===(miniSave.storyStage|0)){
    clearArcadeCheckpoint(id);
    miniSave.storyStage=completed+1;
    miniSave.storyClears=(miniSave.storyClears|0)+1;
    const frag=STORY_STAGES[completed].fragment;
    if(frag){
      state.eventText=`MEMORY / ${frag}`;
      state.eventUntil=now+1700;
      state.eventStrength=.78;
    }
  }else if(storyAllClear()){
    miniSave.encoreIndex=((miniSave.encoreIndex|0)+1)%STORY_STAGES.length;
  }
  writeMiniSave();
}

/* ---------- 01 STATIC BLOCK ---------- */
// Modern Tetris-style controls:
// LEFT/RIGHT move, DOWN soft drop, UP/X rotate CW, Z rotate CCW,
// SPACE hard drop, C/SHIFT hold.
const ST_PIECES={
  I:[[1,1,1,1]],
  O:[[1,1],[1,1]],
  T:[[0,1,0],[1,1,1]],
  J:[[1,0,0],[1,1,1]],
  L:[[0,0,1],[1,1,1]],
  S:[[0,1,1],[1,1,0]],
  Z:[[1,1,0],[0,1,1]]
};
const ST_NAMES=Object.keys(ST_PIECES);
function stRotateCW(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function stRotateCCW(m){let q=m;for(let i=0;i<3;i++)q=stRotateCW(q);return q}
function staticMakeBag(g){
  const a=ST_NAMES.slice();
  // deterministic Fisher-Yates based on piece serial so replays stay stable.
  let seed=((g.serial+1)*2654435761)>>>0;
  for(let i=a.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]]}
  g.bag.push(...a);
}
function staticNextName(g){if(g.bag.length<7)staticMakeBag(g);return g.bag.shift()}
function staticInit(){
  const cp=getArcadeCheckpoint("STATIC");
  const savedLines=clamp(cp?.lines|0,0,5);
  const savedBoard=Array.isArray(cp?.board)&&cp.board.length===20
    ? cp.board.map(row=>Array.from({length:10},(_,i)=>row?.[i]?1:0))
    : Array.from({length:20},()=>Array(10).fill(0));
  const g={board:savedBoard,piece:null,name:'T',x:3,y:0,drop:0,lines:savedLines,chain:0,hardDrops:0,serial:0,bag:[],next:[],hold:null,holdUsed:false,lock:0};
  while(g.next.length<5)g.next.push(staticNextName(g));
  staticSpawn(g);
  if(savedLines>0||cp?.board)eventFlash(`STATIC / RESUME ${savedLines}/6`,nowMs(),900,.68);
  return g;
}
function staticSpawn(g,forcedName=null){
  g.name=forcedName||g.next.shift();
  while(g.next.length<5)g.next.push(staticNextName(g));
  g.piece=ST_PIECES[g.name].map(r=>r.slice());
  g.x=Math.floor((10-g.piece[0].length)/2);g.y=0;g.drop=0;g.lock=0;g.serial++;
  if(!staticValid(g,g.x,g.y,g.piece)){
    // Stage is not an endless survival mode: recover without silently deleting progress.
    g.board=Array.from({length:20},()=>Array(10).fill(0));
    g.x=Math.floor((10-g.piece[0].length)/2);g.y=0;
    juiceImpact(495,250,.7,{label:"STACK RESET",n:18,shake:5,flash:.08});
  }
}
function staticValid(g,x,y,p){
  for(let r=0;r<p.length;r++)for(let c=0;c<p[r].length;c++)if(p[r][c]){
    const xx=x+c,yy=y+r;
    if(xx<0||xx>=10||yy>=20||(yy>=0&&g.board[yy][xx]))return false;
  }
  return true;
}
function staticTryRotate(g,dir,now){
  if(g.name==='O'){juiceReward("micro",495,690,.12,"");return true}
  const rot=dir>0?stRotateCW(g.piece):stRotateCCW(g.piece);
  // Compact SRS-style wall-kick search. The important play property is that a
  // legal rotation near walls/floor is attempted instead of simply failing.
  const kicks=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1],[0,-2]];
  for(const [dx,dy] of kicks){
    if(staticValid(g,g.x+dx,g.y+dy,rot)){
      g.x+=dx;g.y+=dy;g.piece=rot;g.lock=0;
      juiceReward("snap",495,690,.30,dir>0?"ROTATE ↻":"ROTATE ↺");return true;
    }
  }
  return false;
}
function staticLock(g,now){
  for(let r=0;r<g.piece.length;r++)for(let c=0;c<g.piece[r].length;c++)if(g.piece[r][c]){
    const yy=g.y+r,xx=g.x+c;if(yy>=0&&yy<20)g.board[yy][xx]=1;
  }
  let cleared=0;
  for(let r=19;r>=0;r--){
    if(g.board[r].every(Boolean)){g.board.splice(r,1);g.board.unshift(Array(10).fill(0));cleared++;r++}
  }
  if(cleared){
    g.lines+=cleared;g.chain++;
    const p=clamp(.55+cleared*.12+g.chain*.05,0,1);
    juiceReward(cleared>=3?"power":"item",495,360,p,`${cleared} LINE`);
    song.harmonyIndex=(song.harmonyIndex+cleared)%4;
    addScore([0,100,300,500,800][cleared]||800,now);
    if(g.lines<6)setArcadeCheckpoint("STATIC",{lines:g.lines,board:g.board.map(row=>row.slice())},"LINE SAVE");
    if(g.lines>=6){arcadeFinish("STATIC",now,"6 LINES CLEAR");return}
  }else g.chain=0;
  g.holdUsed=false;staticSpawn(g);
}
function staticHardDrop(g,now){
  let landing=g.y;while(staticValid(g,g.x,landing+1,g.piece))landing++;
  const cells=Math.max(0,landing-g.y);g.y=landing;g.hardDrops++;g.drop=0;
  if(cells>0)addScore(cells*2,now);
  juiceReward(cells>=8?"item":"snap",495,690,clamp(.28+cells*.025,.28,.68),`HARD DROP ${cells}`);
  staticLock(g,now);
}
function staticHold(g,now){
  if(g.holdUsed)return false;
  const current=g.name;g.holdUsed=true;
  if(g.hold===null){g.hold=current;staticSpawn(g)}
  else{const swap=g.hold;g.hold=current;staticSpawn(g,swap)}
  g.holdUsed=true;juiceReward("snap",495,690,.28,"HOLD");return true;
}
function staticUpdate(g,dt,now){
  if(arcadeLeftPressed&&staticValid(g,g.x-1,g.y,g.piece)){g.x--;g.lock=0;juiceReward("micro",360,700,.14,"")}
  if(arcadeRightPressed&&staticValid(g,g.x+1,g.y,g.piece)){g.x++;g.lock=0;juiceReward("micro",600,700,.14,"")}
  if(staticRotateCWPressed)staticTryRotate(g,1,now);
  if(staticRotateCCWPressed)staticTryRotate(g,-1,now);
  if(staticHoldPressed)staticHold(g,now);
  if(arcadeActionPressed){staticHardDrop(g,now);return}

  const grounded=!staticValid(g,g.x,g.y+1,g.piece);
  if(grounded){
    g.lock+=dt;
    if(g.lock>=.48){staticLock(g,now);return}
  }else g.lock=0;

  g.drop+=dt*(staticSoftDropDown?18:1);
  const interval=Math.max(.11,.52-g.lines*.025);
  while(g.drop>=interval){
    g.drop-=interval;
    if(staticValid(g,g.x,g.y+1,g.piece)){
      g.y++;if(staticSoftDropDown)addScore(1,now);
    }else break;
  }
}

/* ---------- 02 MINIMAL SCRATCH ---------- */
function scratchInit(now){
  return {notes:[],spawn:0,hits:0,miss:0,combo:0,best:0,start:now,lastJudgement:"",judgeUntil:0};
}
function scratchUpdate(g,dt,now){
  g.spawn-=dt;
  if(g.spawn<=0){
    const lane=((g.hits+g.miss+Math.floor((now-g.start)/500))%2);
    g.notes.push({lane,y:130,hit:false});
    g.spawn=.48;
  }
  for(const n of g.notes)n.y+=310*dt;
  function hitLane(lane){
    let best=null,dist=999;
    for(const n of g.notes)if(!n.hit&&n.lane===lane){
      const d=Math.abs(n.y-690);if(d<dist){dist=d;best=n}
    }
    if(best&&dist<78){
      best.hit=true;g.hits++;g.combo++;g.best=Math.max(g.best,g.combo);
      const perfect=dist<26;
      g.lastJudgement=perfect?"PERFECT":"GOOD";g.judgeUntil=now+350;
      juiceReward(perfect?"item":"snap",lane?650:310,690,perfect?.72:.48,perfect?"PERFECT":"GOOD");
      song.twPleasureCharge=clamp(song.twPleasureCharge+(perfect?.035:.018),0,1);
    }else{
      g.combo=0;g.miss++;g.lastJudgement="MISS";g.judgeUntil=now+300;
      juiceImpact(lane?650:310,690,.38,{label:"MISS",n:5,shake:1.4,flash:.025});
    }
  }
  if(arcadeLeftPressed)hitLane(0);
  if(arcadeRightPressed)hitLane(1);
  for(const n of g.notes){
    if(!n.hit&&n.y>785){n.hit=true;g.miss++;g.combo=0}
  }
  g.notes=g.notes.filter(n=>!n.hit&&n.y<830);
  if(g.hits>=20)arcadeFinish("SCRATCH",now,g.best>=10?"GROOVE LOCK":"GROOVE");
}

/* ---------- 03 AMBIENT LABYRINTH ---------- */
function mazeOpenDirs(g,x,y){
  const cell=g.cells[y]?.[x];if(!cell)return [];
  const dirs=[[0,-1],[1,0],[0,1],[-1,0]],out=[];
  for(let i=0;i<4;i++){
    const nx=x+dirs[i][0],ny=y+dirs[i][1];
    if(!cell.walls[i]&&nx>=0&&nx<g.w&&ny>=0&&ny<g.h)out.push(i);
  }
  return out;
}
function mazeChooseDir(g,intent=0){
  const open=mazeOpenDirs(g,g.x,g.y);
  if(!open.length)return -1;
  const back=(g.dir+2)%4,left=(g.dir+3)%4,right=(g.dir+1)%4,forward=g.dir;
  if(intent<0&&open.includes(left))return left;
  if(intent>0&&open.includes(right))return right;
  if(open.includes(forward))return forward;
  const noBack=open.filter(i=>i!==back);
  if(noBack.length)return noBack[(g.steps+g.found)%noBack.length];
  return open[0];
}
function mazeHasMemoryAt(g,x,y){
  return g.echoes.some(e=>!e.taken&&e.x===x&&e.y===y);
}
function mazeRefreshChoices(g){
  g.choices=mazeOpenDirs(g,g.x,g.y);
  if(!g.choices.length){g.choiceIndex=0;g.selectedDir=-1;return}
  g.choiceIndex=((g.choiceIndex||0)%g.choices.length+g.choices.length)%g.choices.length;
  g.selectedDir=g.choices[g.choiceIndex];
}
function mazeBuildDashPath(g,firstDir){
  const dirs=[[0,-1],[1,0],[0,1],[-1,0]],path=[];
  let x=g.x,y=g.y,dir=firstDir;
  const seen=new Set();
  for(let guard=0;guard<g.w*g.h*2;guard++){
    const open=mazeOpenDirs(g,x,y);
    if(!open.includes(dir))break;
    const nx=x+dirs[dir][0],ny=y+dirs[dir][1];
    if(nx<0||nx>=g.w||ny<0||ny>=g.h)break;
    path.push({x:nx,y:ny,dir});
    x=nx;y=ny;
    const key=`${x},${y},${dir}`;
    if(seen.has(key))break;
    seen.add(key);

    // Stop at anything meaningful so the player gets a new decision.
    if(mazeHasMemoryAt(g,x,y) || (g.goalOpen&&x===g.goalX&&y===g.goalY))break;
    const nextOpen=mazeOpenDirs(g,x,y);
    if(nextOpen.length!==2)break; // junction or dead-end
    const back=(dir+2)%4;
    const forward=nextOpen.find(d=>d!==back);
    if(forward===undefined)break;
    dir=forward;
  }
  return path;
}
function mazeCollectCell(g,now){
  for(const e of g.echoes){
    if(!e.taken&&e.x===g.x&&e.y===g.y){
      e.taken=true;g.found++;g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);
      juiceReward("power",495,450,.84,`MEMORY / ${e.label}`);addScore(1400+g.found*450,now);
      song.twPleasureCharge=clamp(song.twPleasureCharge+.14,0,1);
      if(audioReady){
        const snap=snapshotChord();deepSubHit(43+g.found*2,.19,now,.34);
        [0,2,4].forEach((d,i)=>warmVoiceSemi(chordTone(d,1+(i===2?1:0),snap),.052+.009*g.found,.44,(i-1)*.24,-.12,now+i*28));
        airShimmer(chordTone(4,4,snap),.14,now+82,.36,.10);
      }
      if(g.found>=3){g.goalOpen=true;juiceReward("power",495,450,.92,"HOME OPEN")}
    }
  }
  if(g.goalOpen&&g.x===g.goalX&&g.y===g.goalY){arcadeFinish("LABYRINTH",now,"MEMORY FOUND");return true}
  return false;
}
function mazeBeginDash(g,dir,now){
  const path=mazeBuildDashPath(g,dir);
  if(!path.length){
    mazeRefreshChoices(g);
    juiceImpact(495,450,.18,{label:"NO PATH",n:3,shake:.4,flash:.01});
    return false;
  }
  g.dashPath=path;g.dashIndex=0;g.dashT=0;g.dashing=true;
  g.fromX=g.x;g.fromY=g.y;g.toX=path[0].x;g.toY=path[0].y;
  g.lastDir=dir;g.sonarUntil=now+260;
  juiceReward("snap",495,760,.30,"GO");
  return true;
}
function mazeInit(){
  const w=11,h=9,cells=Array.from({length:h},()=>Array.from({length:w},()=>({v:false,walls:[1,1,1,1]})));
  const stack=[[0,0]];cells[0][0].v=true;
  const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  let seed=7331;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  while(stack.length){
    const [x,y]=stack[stack.length-1],opts=[];
    dirs.forEach((d,i)=>{const nx=x+d[0],ny=y+d[1];if(nx>=0&&nx<w&&ny>=0&&ny<h&&!cells[ny][nx].v)opts.push([i,nx,ny])});
    if(!opts.length){stack.pop();continue}
    const [i,nx,ny]=opts[Math.floor(rnd()*opts.length)];
    cells[y][x].walls[i]=0;cells[ny][nx].walls[(i+2)%4]=0;cells[ny][nx].v=true;stack.push([nx,ny]);
  }
  // A few loops prevent the maze from becoming a long forced corridor.
  for(let k=0;k<10;k++){
    const x=1+Math.floor(rnd()*(w-2)),y=1+Math.floor(rnd()*(h-2));
    const i=Math.floor(rnd()*4),d=dirs[i],nx=x+d[0],ny=y+d[1];
    if(nx>=0&&nx<w&&ny>=0&&ny<h){cells[y][x].walls[i]=0;cells[ny][nx].walls[(i+2)%4]=0}
  }
  const g={
    w,h,cells,x:0,y:0,lastDir:1,
    choices:[],choiceIndex:0,selectedDir:1,
    dashing:false,dashPath:[],dashIndex:0,dashT:0,dashDur:.085,
    fromX:0,fromY:0,toX:0,toY:0,steps:0,found:0,
    goalX:w-1,goalY:h-1,goalOpen:false,
    echoes:[
      {x:2,y:6,taken:false,label:"RAIN",color:C.cool},
      {x:7,y:2,taken:false,label:"TRAIN",color:C.accent},
      {x:9,y:7,taken:false,label:"ROOM",color:C.green}
    ],
    sonarUntil:0,combo:0,bestCombo:0,invalidMoves:0
  };
  mazeRefreshChoices(g);
  // Start by pointing east when available.
  const east=g.choices.indexOf(1);if(east>=0){g.choiceIndex=east;g.selectedDir=1}
  return g;
}
function mazeUpdate(g,dt,now){
  if(g.dashing){
    g.dashT+=dt/g.dashDur;
    while(g.dashT>=1&&g.dashing){
      g.dashT-=1;
      g.x=g.toX;g.y=g.toY;g.steps++;
      if(mazeCollectCell(g,now))return;
      g.dashIndex++;
      if(g.dashIndex>=g.dashPath.length){
        g.dashing=false;g.dashT=0;mazeRefreshChoices(g);
        g.sonarUntil=now+420;
        break;
      }
      g.fromX=g.x;g.fromY=g.y;
      const n=g.dashPath[g.dashIndex];g.toX=n.x;g.toY=n.y;
    }
    return;
  }

  mazeRefreshChoices(g);
  if(arcadeLeftPressed&&g.choices.length){
    g.choiceIndex=(g.choiceIndex+g.choices.length-1)%g.choices.length;g.selectedDir=g.choices[g.choiceIndex];
    juiceReward("micro",390,760,.18,"SELECT");
  }
  if(arcadeRightPressed&&g.choices.length){
    g.choiceIndex=(g.choiceIndex+1)%g.choices.length;g.selectedDir=g.choices[g.choiceIndex];
    juiceReward("micro",600,760,.18,"SELECT");
  }
  if(arcadeActionPressed&&g.choices.length){
    mazeBeginDash(g,g.selectedDir,now);
  }
}

/* ---------- 04 ISOLATION TENNIS ---------- */
function tennisInit(){return {px:495,pv:0,bx:495,by:360,bvx:225,bvy:280,rally:0,best:0,miss:0}}
function tennisUpdate(g,dt,now){
  const dir=(rightDown?1:0)-(leftDown?1:0);
  g.pv=lerp(g.pv,dir*620,clamp(dt*14,0,1));g.px=clamp(g.px+g.pv*dt,230,730);
  g.bx+=g.bvx*dt;g.by+=g.bvy*dt;
  if(g.bx<210){g.bx=210;g.bvx=Math.abs(g.bvx)}
  if(g.bx>780){g.bx=780;g.bvx=-Math.abs(g.bvx)}
  if(g.by<145){g.by=145;g.bvy=Math.abs(g.bvy)}

/* ---------- 08 GRAVITY WELL ---------- */
function gravityInit(now){
  return {x:650,y:450,vx:0,vy:215,energy:1,orbits:0,start:now,pickups:[],spawn:0};
}
function gravityUpdate(g,dt,now){
  const cx=495,cy=450,dx=cx-g.x,dy=cy-g.y,r2=dx*dx+dy*dy,r=Math.sqrt(r2);
  const force=780000/Math.max(9000,r2);
  g.vx+=dx/r*force*dt;g.vy+=dy/r*force*dt;
  const dir=(rightDown?1:0)-(leftDown?1:0);
  if(dir){
    const tx=-dy/r,ty=dx/r;g.vx+=tx*dir*95*dt;g.vy+=ty*dir*95*dt;
  }
  g.x+=g.vx*dt;g.y+=g.vy*dt;
  g.spawn-=dt;
  if(g.spawn<=0&&g.pickups.length<4){
    const a=((now-g.start)*.0014+g.orbits*1.7)%(Math.PI*2),rr=125+(g.orbits%3)*35;
    g.pickups.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,taken:false});
    g.spawn=1.8;
  }
  for(const p of g.pickups)if(!p.taken&&Math.hypot(g.x-p.x,g.y-p.y)<25){
    p.taken=true;g.orbits++;juiceReward("item",p.x,p.y,.75,`ORBIT ${g.orbits}`);
    deepSubHit(46+g.orbits,.12,now,.18);
  }
  g.pickups=g.pickups.filter(p=>!p.taken);
  if(r<62||r>340){
    juiceImpact(g.x,g.y,.72,{label:r<62?"TOO DEEP":"LOST ORBIT",n:16,shake:4,flash:.07});
    g.x=650;g.y=450;g.vx=0;g.vy=215;
  }
  if(g.orbits>=7)arcadeFinish("GRAVITY",now,"SUB LOCKED");
}

/* ---------- 16 TEMPEST RING / VECTOR PRESSURE ---------- */
function angleDelta(a,b){
  let d=(a-b)%(Math.PI*2);
  if(d>Math.PI)d-=Math.PI*2;
  if(d<-Math.PI)d+=Math.PI*2;
  return d;
}
function tempestWaveEnemies(wave){
  const n=10+wave*3,out=[];
  for(let i=0;i<n;i++){
    out.push({
      lane:(i*5+wave*3)%16,
      r:35-(i%4)*14,
      speed:52+wave*13+(i%3)*8,
      alive:true,
      type:(i+wave)%4===0?1:0,
      phase:i*.47
    });
  }
  return out;
}
function tempestInit(){
  const cp=getArcadeCheckpoint("TEMPEST");
  const wave=clamp(cp?.wave|0,0,2);
  const g={
    theta:-Math.PI/2,omega:0,bullets:[],enemies:tempestWaveEnemies(wave),
    wave,lives:clamp(cp?.lives|0,1,3)||3,combo:Math.max(0,cp?.combo|0),
    bestCombo:Math.max(0,cp?.bestCombo|0),fireCd:0,flash:0
  };
  if(Array.isArray(cp?.enemies)&&cp.enemies.length===g.enemies.length){
    g.enemies.forEach((e,i)=>{
      const q=cp.enemies[i];
      e.alive=q?.alive!==false;
      e.r=clamp(+q?.r||e.r,20,285);
    });
  }
  return g;
}
function tempestSave(g,reason="VECTOR SAVE"){
  setArcadeCheckpoint("TEMPEST",{
    wave:g.wave,lives:g.lives,combo:g.combo,bestCombo:g.bestCombo,
    enemies:g.enemies.map(e=>({lane:e.lane,r:e.r,alive:e.alive,type:e.type}))
  },reason);
}
function tempestUpdate(g,dt,now){
  const dir=(rightDown?1:0)-(leftDown?1:0);
  g.omega=lerp(g.omega,dir*3.1,clamp(dt*12,0,1));
  g.theta+=g.omega*dt;
  g.fireCd=Math.max(0,g.fireCd-dt);
  if(arcadeActionPressed&&g.fireCd<=0){
    g.bullets.push({theta:g.theta,r:286,vr:-610});
    g.fireCd=.12;
    juiceReward("snap",495+Math.cos(g.theta)*285,450+Math.sin(g.theta)*285,.28,"");
  }
  for(const b of g.bullets)b.r+=b.vr*dt;
  for(const e of g.enemies)if(e.alive){
    e.phase+=dt*(1.5+g.wave*.2);
    e.r+=e.speed*dt*(e.type?1.12:1);
  }

  for(const b of g.bullets)for(const e of g.enemies)if(e.alive){
    const ea=e.lane/16*Math.PI*2-Math.PI/2;
    if(Math.abs(angleDelta(b.theta,ea))<.115&&Math.abs(b.r-e.r)<24){
      e.alive=false;b.r=-30;g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);
      addScore(190+g.combo*28,now);
      juiceReward(g.combo%5===0?"power":"break",
        495+Math.cos(ea)*e.r,450+Math.sin(ea)*e.r,
        clamp(.42+g.combo*.025,.42,.9),g.combo%5===0?`VECTOR ×${g.combo}`:"");
      if(audioReady){
        const snap=snapshotChord();
        chipPulse(chordTone((e.lane+g.combo)%5,4,snap),.30,now,.055,Math.sin(ea)*.55,.88);
      }
      tempestSave(g,"VECTOR HIT");
    }
  }
  g.bullets=g.bullets.filter(b=>b.r>10);

  for(const e of g.enemies)if(e.alive&&e.r>=286){
    const ea=e.lane/16*Math.PI*2-Math.PI/2;
    e.alive=false;
    if(Math.abs(angleDelta(g.theta,ea))<.34){
      g.lives--;g.combo=0;
      juiceImpact(495+Math.cos(ea)*286,450+Math.sin(ea)*286,.82,{label:`RIM HIT / ${g.lives}`,n:18,shake:6,flash:.1});
      if(g.lives<=0){
        g.lives=3;
        tempestSave(g,"TEMPEST FAIL");
        leaveBonus(now,false);
        return;
      }
    }else{
      juiceReward("micro",495+Math.cos(ea)*286,450+Math.sin(ea)*286,.22,"DODGE");
    }
  }

  if(!g.enemies.some(e=>e.alive)){
    if(g.wave>=2){
      arcadeFinish("TEMPEST",now,g.bestCombo>=12?"3 TUBES / VECTOR MASTER":"3 TUBES CLEAR");
      return;
    }
    g.wave++;g.combo=0;g.enemies=tempestWaveEnemies(g.wave);
    tempestSave(g,"TUBE SAVE");
    juiceReward("power",495,450,.95,`TUBE ${g.wave} CLEAR`);
  }
}

    if(safe){
      const quality=clamp(1-speed/105-Math.abs(g.angle)*.55,0,1);
      const pts=Math.round((650+quality*1200)*pad.m);
      g.landings++;g.best=Math.max(g.best,quality);

      if(audioReady){

        [0,2,4].forEach((d,i)=>warmVoiceSemi(chordTone(d,1+(pad.m===3?1:0),snap),.04,.34,(i-1)*.18,-.06,now+i*28));
      }

      setArcadeCheckpoint("LANDER",{landings:g.landings,best:g.best},"LANDING SAVE");

}

function joustEnemy(i,wave){
  return {x:300+(i*127+wave*61)%390,y:260+(i%3)*150,vx:(i%2?1:-1)*(95+wave*16),
          vy:-50-(i%3)*18,alive:true,flap:.25+i*.11,phase:i*.8};
}
function joustSpawnWave(g){
  const n=3+g.wave;
  g.enemies=Array.from({length:n},(_,i)=>joustEnemy(i,g.wave));
}
function joustInit(){
  const cp=getArcadeCheckpoint("JOUST");
  const g={x:495,y:520,vx:0,vy:0,wave:clamp(cp?.wave|0,0,2),kills:Math.max(0,cp?.kills|0),
           lives:clamp(cp?.lives|0,1,3)||3,combo:0,bestCombo:Math.max(0,cp?.bestCombo|0),
           enemies:[],flapCd:0,invulnUntil:0};
  joustSpawnWave(g);
  return g;
}
function joustUpdate(g,dt,now){
  const dir=(rightDown?1:0)-(leftDown?1:0);
  g.vx=lerp(g.vx,dir*280,clamp(dt*4.2,0,1));
  if(arcadeActionPressed){
    g.vy-=255;
    g.vy=Math.max(g.vy,-390);
    juiceReward("snap",g.x,g.y,.27,"FLAP");
    if(audioReady){
      const snap=snapshotChord();
      warmVoiceSemi(chordTone((g.kills+2)%5,4,snap),.018,.13,(g.x-495)/360,-.18,now);
    }
  }
  g.vy+=350*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;
  if(g.x<205)g.x=785;if(g.x>785)g.x=205;
  if(g.y<150){g.y=150;g.vy=Math.abs(g.vy)*.35}
  if(g.y>770){g.y=770;g.vy=-210}

  for(const e of g.enemies)if(e.alive){
    e.phase+=dt*2.2;e.flap-=dt;
    const seek=Math.sign(g.x-e.x);
    e.vx=lerp(e.vx,seek*(105+g.wave*22),clamp(dt*1.4,0,1));
    if(e.flap<=0){
      e.vy-=190+g.wave*18;
      e.flap=.55+((Math.sin(e.phase)+1)*.5)*.6;
    }
    e.vy+=335*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.x<205)e.x=785;if(e.x>785)e.x=205;
    if(e.y<170){e.y=170;e.vy=Math.abs(e.vy)*.4}
    if(e.y>760){e.y=760;e.vy=-170}

    if(Math.abs(g.x-e.x)<34&&Math.abs(g.y-e.y)<35&&now>=g.invulnUntil){
      if(g.y<e.y-8){
        e.alive=false;g.kills++;g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);
        addScore(300+g.combo*55,now);
        juiceReward(g.combo%4===0?"power":"item",e.x,e.y,.72,g.combo%4===0?`JOUST ×${g.combo}`:"TOP HIT");
      }else{
        g.lives--;g.combo=0;g.invulnUntil=now+1200;g.vy=-250;
        juiceImpact(g.x,g.y,.78,{label:`LOW HIT / LIFE ${g.lives}`,n:18,shake:6,flash:.1});
        if(g.lives<=0){

          leaveBonus(now,false);return;
        }
      }
    }
  }

  if(!g.enemies.some(e=>e.alive)){
    if(g.wave>=2){arcadeFinish("JOUST",now,g.bestCombo>=6?"3 WAVES / SKY KING":"3 WAVES CLEAR");return}
    g.wave++;joustSpawnWave(g);
    setArcadeCheckpoint("JOUST",{wave:g.wave,kills:g.kills,lives:g.lives,bestCombo:g.bestCombo},"JOUST WAVE SAVE");
    juiceReward("power",495,420,.9,`WAVE ${g.wave} CLEAR`);
  }
}

/* ---------- 19 PUZZLE ORBIT / AIM + MATCH + CASCADE ---------- */
const BUBBLE_COLORS=[0,1,2,3];
function bubbleEmptyGrid(){return Array.from({length:10},()=>Array(8).fill(-1))}
function bubbleMakeInitial(){
  const g=bubbleEmptyGrid();
  for(let r=0;r<5;r++)for(let c=0;c<8;c++)g[r][c]=(r*2+c+(r%2)*2)%4;
  // carve several holes so the first shots create readable tactical choices
  [[4,1],[4,5],[3,3],[3,7],[2,0],[2,6]].forEach(([r,c])=>g[r][c]=-1);
  return g;
}
function bubbleCellXY(r,c){return {x:300+c*56,y:175+r*50}}
function bubbleNeighbors(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>rr>=0&&rr<10&&cc>=0&&cc<8);
}
function bubbleInit(){
  const cp=getArcadeCheckpoint("BUBBLE");
  const grid=Array.isArray(cp?.grid)&&cp.grid.length===10
    ? cp.grid.map(row=>Array.from({length:8},(_,i)=>Number.isInteger(row?.[i])?row[i]:-1))
    : bubbleMakeInitial();
  return {grid,angle:0,shot:null,popped:Math.max(0,cp?.popped|0),shots:Math.max(0,cp?.shots|0),
          misses:Math.max(0,cp?.misses|0),nextColor:clamp(cp?.nextColor|0,0,3),
          chain:0,bestChain:Math.max(0,cp?.bestChain|0),pressure:0};
}
function bubbleConnected(g,sr,sc,color){
  const out=[],seen=new Set(),q=[[sr,sc]];
  while(q.length){
    const [r,c]=q.shift(),key=r+","+c;if(seen.has(key))continue;seen.add(key);
    if(g.grid[r]?.[c]!==color)continue;
    out.push([r,c]);
    for(const n of bubbleNeighbors(r,c))q.push(n);
  }
  return out;
}
function bubbleDropDisconnected(g){
  const seen=new Set(),q=[];
  for(let c=0;c<8;c++)if(g.grid[0][c]>=0)q.push([0,c]);
  while(q.length){
    const [r,c]=q.shift(),key=r+","+c;if(seen.has(key))continue;seen.add(key);
    if(g.grid[r]?.[c]<0)continue;
    for(const [rr,cc] of bubbleNeighbors(r,c))if(g.grid[rr][cc]>=0)q.push([rr,cc]);
  }
  let dropped=0;
  for(let r=0;r<10;r++)for(let c=0;c<8;c++)if(g.grid[r][c]>=0&&!seen.has(r+","+c)){g.grid[r][c]=-1;dropped++}
  return dropped;
}
function bubbleAddPressure(g,now){
  for(let r=9;r>0;r--)g.grid[r]=g.grid[r-1].slice();
  g.grid[0]=Array.from({length:8},(_,c)=>(g.shots+c*3)%4);
  juiceImpact(495,175,.55,{label:"CEILING DOWN",n:12,shake:3,flash:.05});
  if(g.grid[9].some(v=>v>=0)){snapshotCurrentStageProgress("BUBBLE PRESSURE");leaveBonus(now,false)}
}
function bubbleAttach(g,now,x,y){
  let best=null,bd=1e9;
  for(let r=0;r<10;r++)for(let c=0;c<8;c++)if(g.grid[r][c]<0){
    const p=bubbleCellXY(r,c),d=(p.x-x)**2+(p.y-y)**2;
    if(d<bd){bd=d;best=[r,c]}
  }
  if(!best){leaveBonus(now,false);return}
  const [r,c]=best;const color=g.shot.color;g.grid[r][c]=color;g.shot=null;g.shots++;
  const group=bubbleConnected(g,r,c,color);
  if(group.length>=3){
    group.forEach(([rr,cc])=>g.grid[rr][cc]=-1);
    const dropped=bubbleDropDisconnected(g);
    const total=group.length+dropped;g.popped+=total;g.chain++;g.bestChain=Math.max(g.bestChain,g.chain);g.misses=0;
    addScore(total*180+g.chain*240,now);
    juiceReward(total>=7?"power":"item",bubbleCellXY(r,c).x,bubbleCellXY(r,c).y,
      clamp(.48+total*.04,.48,1),total>=7?`CASCADE ${total}`:`POP ${total}`);
    if(audioReady){
      const snap=snapshotChord();
      [0,2,4].slice(0,Math.min(3,group.length)).forEach((d,i)=>
        warmVoiceSemi(chordTone((color+d)%5,3+(total>=7?1:0),snap),.032,.24,(i-1)*.2,-.05,now+i*24));
    }
  }else{
    g.chain=0;g.misses++;
    if(g.misses>0&&g.misses%4===0){bubbleAddPressure(g,now);if(bonusGame.returnAt)return}
  }
  g.nextColor=(g.shots*3+g.popped+1)%4;
  setArcadeCheckpoint("BUBBLE",{
    grid:g.grid.map(row=>row.slice()),popped:g.popped,shots:g.shots,misses:g.misses,
    nextColor:g.nextColor,bestChain:g.bestChain
  },"BUBBLE SHOT SAVE");
  if(g.popped>=30||!g.grid.some(row=>row.some(v=>v>=0)))arcadeFinish("BUBBLE",now,g.bestChain>=4?"30 POP / CASCADE MASTER":"30 POP CLEAR");
}
function bubbleUpdate(g,dt,now){
  const dir=(rightDown?1:0)-(leftDown?1:0);
  g.angle=clamp(g.angle+dir*1.65*dt,-1.18,1.18);
  if(arcadeActionPressed&&!g.shot){
    g.shot={x:495,y:770,vx:Math.sin(g.angle)*500,vy:-Math.cos(g.angle)*500,color:g.nextColor};
    juiceReward("snap",495,770,.28,"SHOOT");
  }
  if(g.shot){
    const b=g.shot;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<270){b.x=270;b.vx=Math.abs(b.vx)}
    if(b.x>720){b.x=720;b.vx=-Math.abs(b.vx)}
    let hit=b.y<148;
    if(!hit){
      for(let r=0;r<10&&!hit;r++)for(let c=0;c<8;c++)if(g.grid[r][c]>=0){
        const p=bubbleCellXY(r,c);
        if(Math.hypot(b.x-p.x,b.y-p.y)<45){hit=true;break}
      }
    }
    if(hit)bubbleAttach(g,now,b.x,b.y);
  }
}


/* ---------- V20-01 COLOR DROP / 同じ色を4つ ---------- */
const DROP_COLORS=[0,1,2,3];
function dropEmptyBoard(){return Array.from({length:12},()=>Array(6).fill(-1))}
function dropNewPiece(g){
  g.piece={x:2,y:0,rot:0,a:(g.serial*3+1)%4,b:(g.serial*5+2)%4};
  g.serial++;
}
function dropCells(p,x=p.x,y=p.y,rot=p.rot){
  const dirs=[[0,-1],[1,0],[0,1],[-1,0]],d=dirs[rot&3];
  return [{x,y,c:p.a},{x:x+d[0],y:y+d[1],c:p.b}];
}
function dropValid(g,x,y,rot){
  for(const q of dropCells(g.piece,x,y,rot)){
    if(q.x<0||q.x>=6||q.y>=12)return false;
    if(q.y>=0&&g.board[q.y][q.x]>=0)return false;
  }
  return true;
}
function dropGroups(g){
  const groups=[],seen=new Set();
  for(let r=0;r<12;r++)for(let c=0;c<6;c++){
    const color=g.board[r][c],key=r+","+c;
    if(color<0||seen.has(key))continue;
    const q=[[r,c]],group=[];
    while(q.length){
      const [rr,cc]=q.shift(),k=rr+","+cc;
      if(seen.has(k)||rr<0||rr>=12||cc<0||cc>=6||g.board[rr][cc]!==color)continue;
      seen.add(k);group.push([rr,cc]);
      q.push([rr-1,cc],[rr+1,cc],[rr,cc-1],[rr,cc+1]);
    }
    if(group.length>=4)groups.push(group);
  }
  return groups;
}
function dropGravity(g){
  for(let c=0;c<6;c++){
    const vals=[];
    for(let r=11;r>=0;r--)if(g.board[r][c]>=0)vals.push(g.board[r][c]);
    for(let r=11;r>=0;r--)g.board[r][c]=vals[11-r]??-1;
  }
}
function dropResolve(g,now){
  let chain=0,total=0,guard=0;
  while(guard++<8){
    const groups=dropGroups(g);if(!groups.length)break;
    chain++;
    for(const group of groups)for(const [r,c] of group){g.board[r][c]=-1;total++}
    dropGravity(g);
  }
  if(total){
    g.cleared+=total;g.chain=chain;g.bestChain=Math.max(g.bestChain,chain);
    addScore(total*120+chain*500,now);
    juiceReward(chain>=2?"power":"item",495,420,.68,chain>=2?`${chain}れんさ！`:`${total}こ消えた！`);
    setArcadeCheckpoint("DROP",{cleared:g.cleared,bestChain:g.bestChain},"COLOR SAVE");
    if(g.cleared>=20){arcadeFinish("DROP",now,"20こ消した！");return true}
  }else g.chain=0;
  return false;
}
function dropLock(g,now){
  for(const q of dropCells(g.piece)){
    if(q.y<0){
      // Lose only the current board; keep collected progress.
      g.board=dropEmptyBoard();dropNewPiece(g);
      setArcadeCheckpoint("DROP",{cleared:g.cleared,bestChain:g.bestChain},"STACK RESET");
      juiceImpact(495,180,.7,{label:"つみすぎ！",n:16,shake:5,flash:.08});
      return;
    }
    g.board[q.y][q.x]=q.c;
  }
  if(dropResolve(g,now))return;
  dropNewPiece(g);
}
function dropInit(){
  const cp=getArcadeCheckpoint("DROP");
  const g={board:dropEmptyBoard(),piece:null,fall:0,serial:1,cleared:Math.max(0,cp?.cleared|0),
           chain:0,bestChain:Math.max(0,cp?.bestChain|0)};
  dropNewPiece(g);return g;
}
function dropUpdate(g,dt,now){
  if(arcadeLeftPressed&&dropValid(g,g.piece.x-1,g.piece.y,g.piece.rot))g.piece.x--;
  if(arcadeRightPressed&&dropValid(g,g.piece.x+1,g.piece.y,g.piece.rot))g.piece.x++;
  if(arcadeActionPressed){
    const nr=(g.piece.rot+1)&3;
    if(dropValid(g,g.piece.x,g.piece.y,nr))g.piece.rot=nr;
  }
  g.fall+=dt*(1.7+Math.min(1.2,g.cleared*.035));
  while(g.fall>=1){
    g.fall-=1;
    if(dropValid(g,g.piece.x,g.piece.y+1,g.piece.rot))g.piece.y++;
    else{dropLock(g,now);break}
  }
}

function goldfishInit(){

function goldfishUpdate(g,dt,now){

    g.scoopT=.48;
    g.scoopCaught=false;
    juiceReward("snap",g.x,650,.24,"すくう！");
  }

  if(g.scoopT>0){
    g.scoopT=Math.max(0,g.scoopT-dt);
    const phase=1-g.scoopT/.48;
    g.scoopY=650-Math.sin(clamp(phase,0,1)*Math.PI)*155;

    if(!g.scoopCaught){
      let best=null,bd=999;
      for(const f of g.fish)if(!f.taken){
        const d=Math.hypot(f.x-g.x,f.y-g.scoopY);
        if(d<bd){bd=d;best=f}
      }
      // Wide but readable catch zone. If the poi visibly overlaps a fish, it catches.
      if(best&&bd<62){
        best.taken=true;
        g.scoopCaught=true;
        g.caught++;g.combo++;g.bestCombo=Math.max(g.bestCombo,g.combo);
        addScore(420+g.combo*55,now);
        juiceReward(g.combo%4===0?"power":"item",best.x,best.y,.72,
          g.combo%4===0?`連続 ${g.combo}匹！`:"すくった！");
        if(audioReady){
          const snap=snapshotChord();
          ambientGlassSemi(chordTone((g.caught+2)%5,5,snap),.11,.28,(best.x-495)/350,now,.92);
          airShimmer(chordTone(4,5,snap),.12,now,.36,(best.x-495)/420);
        }
        setArcadeCheckpoint("GOLDFISH",{caught:g.caught,bestCombo:g.bestCombo},"FISH SAVE");
        if(g.caught>=8){arcadeFinish("GOLDFISH",now,"8匹すくった！");return}
      }
    }

    if(g.scoopT<=0){
      g.scoopY=650;
      if(!g.scoopCaught){
        g.combo=0;
        juiceImpact(g.x,650,.16,{label:"おしい！",n:3,shake:.35,flash:.01});
      }
    }
  }else g.scoopY=650;
}

/* ---------- V24-10 だるま落とし / SMASH RUSH ---------- */
function darumaInit(){
  const cp=getArcadeCheckpoint("DARUMA");
  const removed=clamp(cp?.removed|0,0,5);
  return {
    removed,
    side:removed%2===0?-1:1,
    phase:removed*.77,
    hitLock:0,
    dropAnim:0,
    hammerAnim:0,
    hammerSide:0,
    flying:[],
    combo:0,
    bestCombo:Math.max(0,cp?.bestCombo|0),
    perfectTotal:Math.max(0,cp?.perfectTotal|0),
    misses:0,
    rush:0,
    lastJudge:"",
    message:"出っ張った側を A / D で選ぶ",
    messageUntil:nowMs()+1200,
    impact:0
  };
}
function darumaOffset(g){
  // Readable side-to-side slide. It gets faster, never more complicated.
  return Math.sin(g.phase);
}
function darumaExposure(g){return Math.abs(darumaOffset(g))}
function darumaTargetSide(g){return darumaOffset(g)<0?-1:1}
function darumaSpeed(g){return 1.45+g.removed*.13+(g.rush>0?.18:0)}
function darumaBurst(g,now,side,perfect){
  const y=650-g.removed*56;
  g.flying.push({
    x:495+side*20,y,
    vx:-side*(640+(perfect?180:0)),
    vy:-(perfect?150:95),
    rot:0,vr:-side*(perfect?14:10),life:1.35,
    perfect
  });
  g.hammerAnim=.20;g.hammerSide=side;g.dropAnim=.34;g.impact=.22;
  juiceImpact(495+side*108,y,.90,{label:perfect?"PERFECT!":"SMASH!",n:perfect?28:20,shake:perfect?10:7,flash:perfect?.16:.10});
  if(audioReady){
    deepSubHit(perfect?43:41,perfect?.28:.20,now,.34);
    drumClap(perfect?.64:.46,now+.018);
    drumPerc(perfect?.52:.36,now+.060,side*.24);
    if(perfect||g.rush>0)chipNoise(.22,now+.105,.040,-side*.30);
  }
}
function darumaStrike(g,now){
  if(!g||g.hitLock>0||g.removed>=6)return false;
  g.hitLock=.28;
  const target=darumaTargetSide(g);
  const exposure=darumaExposure(g);
  const correct=g.side===target;

  if(correct&&exposure>=.60){
    const perfect=exposure>=.90;
    g.combo++;
    g.bestCombo=Math.max(g.bestCombo,g.combo);
    if(perfect)g.perfectTotal++;
    if(g.combo>=3)g.rush=Math.max(g.rush,3);
    const side=g.side;
    darumaBurst(g,now,side,perfect);
    g.removed++;
    if(g.rush>0)g.rush--;
    addScore((perfect?1050:620)+g.combo*120,now);
    g.lastJudge=perfect?"PERFECT":"SMASH";
    g.message=perfect?(g.combo>=3?"RUSH! 次も一撃！":"芯！ PERFECT!"):"抜けた！ 次！";
    g.messageUntil=now+720;
    setArcadeCheckpoint("DARUMA",{
      removed:g.removed,bestCombo:g.bestCombo,perfectTotal:g.perfectTotal
    },"DARUMA SMASH SAVE");
    if(g.removed>=6){
      // Keep this path deliberately tiny and deterministic.
      arcadeFinish("DARUMA",now,g.bestCombo>=4?"6段 / SMASH RUSH!":"6段クリア！");
    }
    return true;
  }

  g.combo=0;g.rush=0;g.misses++;
  g.lastJudge=!correct?"反対側！":"まだ早い！";
  g.message=!correct?"出っ張った側から叩く！":"もっと出てから SPACE！";
  g.messageUntil=now+760;
  g.hammerAnim=.16;g.hammerSide=g.side;g.impact=.10;
  juiceImpact(495+g.side*105,650-g.removed*56,.34,{label:g.lastJudge,n:6,shake:2,flash:.025});
  if(audioReady){drumPerc(.20,now,g.side*.28);chipNoise(.08,now,.018,0)}
  if(g.misses>=3){
    setArcadeCheckpoint("DARUMA",{
      removed:g.removed,bestCombo:g.bestCombo,perfectTotal:g.perfectTotal
    },"DARUMA FAIL");
    leaveBonus(now,false);
  }
  return false;
}
function darumaUpdate(g,dt,now){
  if(!g)return;
  const safeDt=clamp(Number.isFinite(dt)?dt:0,0,.05);
  g.phase+=safeDt*darumaSpeed(g)*Math.PI*2;
  g.hitLock=Math.max(0,g.hitLock-safeDt);
  g.dropAnim=Math.max(0,g.dropAnim-safeDt);
  g.hammerAnim=Math.max(0,g.hammerAnim-safeDt);
  g.impact=Math.max(0,g.impact-safeDt);

  if(arcadeLeftPressed){g.side=-1;g.message="左から叩く";g.messageUntil=now+320}
  if(arcadeRightPressed){g.side=1;g.message="右から叩く";g.messageUntil=now+320}
  if(arcadeActionPressed)darumaStrike(g,now);

  for(const b of g.flying){
    b.x+=b.vx*safeDt;b.y+=b.vy*safeDt;b.vy+=690*safeDt;
    b.rot+=b.vr*safeDt;b.life-=safeDt;
  }
  g.flying=g.flying.filter(b=>Number.isFinite(b.x)&&Number.isFinite(b.y)&&b.life>0);
}

function drawMaze(g){
  arcadeHeader(ARCADE_DEFS[2],"A / D SELECT ROUTE · SPACE DASH TO NEXT JUNCTION");
  const cs=62,ox=139,oy=145,now=nowMs();
  const pulse=now<g.sonarUntil?clamp((g.sonarUntil-now)/420,0,1):0;

  // Entire topology is faintly visible now. The game is about route choice, not blindness.
  ctx.save();
  for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){
    const c=g.cells[y][x],px=ox+x*cs,py=oy+y*cs;
    ctx.globalAlpha=.26+pulse*.18;
    if(c.walls[0])line(px,py,px+cs,py,C.paper,1.15);
    if(c.walls[1])line(px+cs,py,px+cs,py+cs,C.paper,1.15);
    if(c.walls[2])line(px,py+cs,px+cs,py+cs,C.paper,1.15);
    if(c.walls[3])line(px,py,px,py+cs,C.paper,1.15);
  }
  ctx.restore();

  // Compute smooth position while dashing.
  const ix=g.dashing?lerp(g.fromX,g.toX,clamp(g.dashT,0,1)):g.x;
  const iy=g.dashing?lerp(g.fromY,g.toY,clamp(g.dashT,0,1)):g.y;
  const px=ox+(ix+.5)*cs,py=oy+(iy+.5)*cs;

  // Memories are always readable; this stage should never fail because information was hidden.
  for(const e of g.echoes){
    if(e.taken)continue;
    const ex=ox+(e.x+.5)*cs,ey=oy+(e.y+.5)*cs,p=.5+.5*Math.sin(now*.008+e.x);
    ctx.save();ctx.globalAlpha=.55+p*.28;
    circle(ex,ey,8+p*3,e.color);circle(ex,ey,18+p*6,null,e.color,1.1+p*.7);
    text(e.label,ex,ey-22,4,e.color,"center",820);ctx.restore();
  }
  const gx=ox+(g.goalX+.5)*cs,gy=oy+(g.goalY+.5)*cs;
  circle(gx,gy,16,null,g.goalOpen?C.accent:C.muted,g.goalOpen?2.2:1.0);
  text(g.goalOpen?"HOME":"LOCK",gx,gy+4,4.5,g.goalOpen?C.accent:C.muted,"center",850);

  // At a junction, draw every legal choice and highlight the selected one.
  const arrows=["↑","→","↓","←"];
  if(!g.dashing){
    for(let i=0;i<g.choices.length;i++){
      const dir=g.choices[i],selected=i===g.choiceIndex;
      const dv=[[0,-1],[1,0],[0,1],[-1,0]][dir];
      const ax=px+dv[0]*28,ay=py+dv[1]*28+5;
      circle(ax,ay,selected?13:9,selected?C.accent:C.soft,C.paper,1);
      text(arrows[dir],ax,ay+4,selected?8:6,selected?C.bg:C.paper,"center",900);
    }
  }
  circle(px,py,g.dashing?11:14,g.dashing?C.cool:C.paper,C.accent,1.4);

  text(`MEMORY ${g.found}/3   ·   JUNCTION ${g.choices.length} WAYS   ·   STEPS ${g.steps}`,495,790,5.5,C.cool,"center",850);
  text(g.dashing?"DASHING...":"A / D SELECT   ·   SPACE GO",495,825,7,g.dashing?C.muted:C.paper,"center",900);
}

function drawDaruma(g){
  if(!g)return;
  const def=ARCADE_DEFS.find(d=>d.id==="DARUMA");
  arcadeHeader(def,`6段叩き抜く · ${g.removed}/6　COMBO ×${g.combo}`);

  const cx=495,baseY=690,blockW=235,blockH=56;
  const remain=Math.max(0,6-g.removed);
  const off=darumaOffset(g);
  const exposure=Math.abs(off);
  const target=off<0?-1:1;
  const slide=off*72;
  const drop=g.dropAnim>0?Math.sin((1-g.dropAnim/.34)*Math.PI)*28:0;

  line(230,730,760,730,C.line,2);
  rect(360,715,270,12,C.soft);

  // Remaining tower. Only the lowest block slides; the rule is visible in the object itself.
  for(let i=0;i<remain;i++){
    const y=baseY-i*blockH+drop;
    const active=i===0;
    const x=cx+(active?slide:0);
    rect(x-blockW/2,y-blockH+5,blockW,blockH-9,active?C.paper:(i%2?C.cool:C.muted));
    rect(x-blockW/2+8,y-blockH+13,blockW-16,blockH-25,C.bg);
    if(active){
      // Bright impact cap on the protruding side.
      const capX=x+target*(blockW/2-12);
      circle(capX,y-25,exposure>=.90?16:11,exposure>=.60?C.accent:C.cool);
      if(exposure>=.60)text(exposure>=.90?"PERFECT":"HIT",capX,y-62,5,C.accent,"center",950);
    }
  }

  // Daruma falls one whole tier after every successful strike.
  const topY=baseY-remain*blockH+drop-5;
  circle(cx,topY-47,56,C.accent);
  circle(cx-18,topY-58,7,C.paper);circle(cx+18,topY-58,7,C.paper);
  circle(cx-18,topY-58,3,C.bg);circle(cx+18,topY-58,3,C.bg);
  line(cx-20,topY-25,cx+20,topY-25,C.bg,3);

  // Hammer selection. One side glows; A/D simply swaps sides.
  for(const side of [-1,1]){
    const hx=side<0?225:765;
    const selected=g.side===side;
    const anim=(g.hammerAnim>0&&g.hammerSide===side)?Math.sin((1-g.hammerAnim/.20)*Math.PI)*82:0;
    const dir=side<0?1:-1;
    line(hx,600,hx+dir*(68+anim),625,selected?C.paper:C.muted,selected?13:8);
    rect(hx+dir*(76+anim)-34,594,68,54,selected?C.accent:C.soft);
    text(side<0?"A  LEFT":"D  RIGHT",hx,682,5.5,selected?C.paper:C.muted,"center",900);
  }

  // Flying blocks = primary spectacle.
  for(const b of g.flying){
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
    rect(-blockW/2,-blockH/2,blockW,blockH-9,b.perfect?C.accent:C.cool);
    rect(-blockW/2+8,-blockH/2+8,blockW-16,blockH-25,C.bg);
    ctx.restore();
  }

  const ready=exposure>=.60&&g.side===target;
  const live=g.messageUntil>nowMs()?g.message:
    ready?(exposure>=.90?"いま！ PERFECT CHANCE！":"SPACEで叩け！"):
    target<0?"左に出てくる → A":"右に出てくる → D";
  text(live,495,112,8,C.paper,"center",950);

  // Giant readable side cue, no meters or hidden physics.
  text(target<0?"← LEFT":"RIGHT →",495,165,8,exposure>=.60?C.accent:C.muted,"center",900);
  rect(320,775,350,12,C.soft);
  rect(320,775,350*exposure,12,exposure>=.90?C.accent:exposure>=.60?C.cool:C.muted);
  text("出っ張り",300,786,4.5,C.muted,"right",850);

  if(g.combo>=3||g.rush>0)text("SMASH RUSH!",495,832,11,C.accent,"center",980);
  text(`抜いた ${g.removed}/6　COMBO ×${g.combo}　ミス ${g.misses}/3`,495,872,5.5,C.cool,"center",900);
}

function enterBonus(now){
  if(state.mode!==MODE.PLAY||now<state.bonusCooldownUntil)return false;
  state.mode=MODE.BONUS;
  state.bonusEntries++;

  try{
    loadMiniSave();
    resetBonusGame(now);
    ARCADE15.clearAt=0;
    ARCADE15.g=null;
    arcadeResetEdges();
    storyStartCurrent(now);
    return true;
  }catch(err){
    console.error("STORY STAGE RECOVERY",err);
    state.mode=MODE.PLAY;
    eventFlash("STAGE RECOVERY",now,900,.6);
    return false;
  }
}

function leaveBonus(now,success){
  if(bonusGame.returnAt)return;
  if(!success)snapshotCurrentStageProgress("C GATE RETURN");
  bonusGame.success=!!success;bonusGame.failed=!success;
  bonusGame.returnAt=now+1100;

  if(success){
    state.bonusWins++;
    addScore(4200+song.bonusTier*650,now);
    song.resonanceXP+=48;
    song.twPleasureCharge=clamp(song.twPleasureCharge+.30,0,1);
    updateMasteryState(now);
    const d=STORY_STAGES.find(x=>x.id===ARCADE15.active);
    eventFlash(d?`${d.role} / CARRIED HOME`:"STAGE / COMPLETE",now,1300,1);
  }else{
    eventFlash(`CHECKPOINT SAVED / ${bonusGame.stage}`,now,1000,.72);
  }
}

function finishBonusReturn(now){
  state.mode=MODE.PLAY;

function circleRectHit(cx,cy,r,q){
  const nx=clamp(cx,q.x-q.w/2,q.x+q.w/2);
  const ny=clamp(cy,q.y-q.h/2,q.y+q.h/2);
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<=r*r;
}

function updateBreakoutPhysics(dt,now){
  const b=bonusGame.ball;
  const dir=(rightDown?1:0)-(leftDown?1:0);

  bonusGame.paddleV=lerp(bonusGame.paddleV,dir*620,clamp(dt*14,0,1));
  bonusGame.paddleX=clamp(bonusGame.paddleX+bonusGame.paddleV*dt,250,740);

  const targetSpeed=430+bonusGame.broken*3.2+(state.game==="B"?45:0)+song.bonusTier*14;
  b.x+=b.vx*dt;b.y+=b.vy*dt;

  if(b.x<215+b.r){b.x=215+b.r;b.vx=Math.abs(b.vx)}
  if(b.x>775-b.r){b.x=775-b.r;b.vx=-Math.abs(b.vx)}
  if(b.y<150+b.r){b.y=150+b.r;b.vy=Math.abs(b.vy)}

  for(const q of bonusGame.blocks){
    if(!q.alive||!circleRectHit(b.x,b.y,b.r,q))continue;
    const dx=(b.x-q.x)/(q.w*.5+b.r);
    const dy=(b.y-q.y)/(q.h*.5+b.r);
    if(Math.abs(dx)>Math.abs(dy))b.vx=(dx>=0?1:-1)*Math.abs(b.vx);
    else b.vy=(dy>=0?1:-1)*Math.abs(b.vy);
    registerBreakoutBlockHit(q,now);
    break;
  }

  const py=bonusGame.paddleY;
  if(b.vy>0&&b.y+b.r>=py-10&&b.y-b.r<=py+14&&
     b.x>=bonusGame.paddleX-bonusGame.paddleW*.56-b.r&&
     b.x<=bonusGame.paddleX+bonusGame.paddleW*.56+b.r){
    const rel=clamp((b.x-bonusGame.paddleX)/(bonusGame.paddleW*.5),-1,1);
    b.y=py-10-b.r;
    const angle=rel*.88;
    b.vx=Math.sin(angle)*targetSpeed+bonusGame.paddleV*.16;
    b.vy=-Math.cos(angle)*targetSpeed;
    if(Math.abs(b.vy)<250)b.vy=-250;
  }

  const sp=Math.hypot(b.vx,b.vy);
  if(sp>0){
    const sc=clamp(targetSpeed/sp,.88,1.12);
    b.vx*=sc;b.vy*=sc;
  }
  if(Math.abs(b.vy)<190)b.vy=(b.vy<0?-1:1)*190;

  // Save partial breakout and exit, rather than destroying the whole chapter.
  if(b.y>875){
    miniSave.brokenMask=bonusMaskFromBlocks();
    saveMiniCheckpoint("BREAKOUT");
    leaveBonus(now,false);
  }
}

function updateBonus(dt,now){
  if(state.mode!==MODE.BONUS)return;
  dt=clamp(dt,0,1/15);

  if(bonusGame.returnAt){
    if(now>=bonusGame.returnAt)finishBonusReturn(now);
    return;
  }
  if(now>=bonusGame.endAt){
    leaveBonus(now,false);
    return;
  }

  if(bonusGame.stage==="AR15"){
    arcadeUpdate(dt,now);
  }else if(bonusGame.stage==="BREAKOUT"){
    updateBreakoutPhysics(dt,now);
  }else if(bonusGame.stage==="REWARD"){
    updateRewardDrop(dt,now);
  }else if(bonusGame.stage==="PHRASE_PLAY"){
    bonusGame.reward.pulse+=dt*4;
    // hard fallback: the race starts even if a scheduled bar callback was missed.
    if(bonusGame.raceFallbackAt&&now>=bonusGame.raceFallbackAt){
      startRaceStage(now,song.transportBar);
    }
  }else if(bonusGame.stage==="RACE"){
    updateRace(dt,now);
  }else if(bonusGame.stage==="KINGDOM"){
    try{
      updateKingdom(dt,now);
    }catch(err){
      console.error("KINGDOM UPDATE RECOVERY",err);
      bonusJumpDown=false;
      bonusJumpPressed=false;
      miniSave.kingdomCheckpoint=clamp(bonusGame.kingdom.checkpoint|0,0,3);
      miniSave.kingdomUnlocked=true;
      miniSave.stage="KINGDOM";
      writeMiniSave();
      leaveBonus(now,false);
    }
  }
}

function drawDataFX(now){

  song.dataBurst=Math.max(0,song.dataBurst-(REDUCED_MOTION?.05:.018));
  const build=songProgress();

  // The rhythm itself becomes visible as it is composed.
  // PULSE -> selected physical accents -> shifted responses.
  ctx.save();
  ctx.globalAlpha=.28;
  const gy=872;
  for(let i=0;i<16;i++){
    const pulse=(i===0||i===8);
    const a=song.rhythmAccent[i];
    const g=song.rhythmGhost[i];
    const h=pulse?7:a?10:g?4:1;
    rect(170+i*37,gy-h,2,h,pulse?C.cool:(a?C.paper:(g?C.muted:C.line)));
  }
  ctx.restore();

  // Quiet score-data strip.
  ctx.save();
  ctx.globalAlpha=.38;
  const y=888;
  for(let i=0;i<16;i++){
    const on=song.drum[i]||song.tick[i]||song.arp[i]>=0||song.melody[i]>=0;
    if(on)rect(155+i*49,y-4,Math.max(2,5+(i%4)*2),2,i===song.step?C.accent:C.paper);
  }
  ctx.restore();

  // 124-bar chapter change: one deterministic visual shock.
  if(song.epilogue){
    ctx.save();
    const e=(now-song.epilogueAt)/1000;
    ctx.globalAlpha=clamp(.10+e*.035,.10,.34);
    rect(0,0,960,900,C.bg);

  if(song.overdrive){

  ctx.fillStyle="#050608";
  ctx.fillRect(0,0,canvas.width/dpr,canvas.height/dpr);

      (s.stage&&s.stage!=="BREAKOUT") ||
      (s.brokenMask|0)!==0 ||
      (s.drumBuild|0)>0 ||
      !!s.raceCleared ||

        if(down&&!e.repeat){bonusJumpDown=true;bonusJumpPressed=true}

  }
  if(["a","arrowleft"].includes(k)){
    if(down&&!e.repeat&&!leftDown){
      const f=state.screen===SCREEN.UPPER?FL.upperL:FL.lowerL;

   V26 DIRECT SCREEN INPUT
   No visual controller. Multi-touch works directly on the canvas.

   LEFT THIRD   -> A / left flipper
   CENTER THIRD -> SPACE / launch / action
   RIGHT THIRD  -> D / right flipper
   ------------------------------------------------------------ */
const screenPointers=new Map();
const screenZoneCounts={left:0,action:0,right:0};
let fullscreenAttempted=false;

function tryImmersiveFullscreen(){
  if(fullscreenAttempted||document.fullscreenElement)return;
  fullscreenAttempted=true;
  const el=document.documentElement;
  try{
    const p=el.requestFullscreen?.({navigationUI:"hide"})
      || el.webkitRequestFullscreen?.();
    if(p&&typeof p.catch==="function")p.catch(()=>{});
  }catch(_){}
  // iOS Safari does not expose arbitrary-element fullscreen on every version.
  // viewport-fit + fixed 100dvh still provides the maximum browser viewport.
  try{window.scrollTo(0,1)}catch(_){}
}

function screenZoneFromPointer(e){
  const r=canvas.getBoundingClientRect();
  const x=clamp((e.clientX-r.left)/Math.max(1,r.width),0,1);
  if(x<.34)return "left";
  if(x>.66)return "right";
  return "action";
}

function screenZoneOn(zone){
  screenZoneCounts[zone]++;
  if(screenZoneCounts[zone]>1)return;

  if(zone==="left"){
    if(!leftDown&&state.mode===MODE.BONUS)arcadeLeftPressed=true;
    if(!leftDown&&state.mode===MODE.PLAY){
      const f=state.screen===SCREEN.UPPER?FL.upperL:FL.lowerL;
      juiceReward("flip",f.x,f.y,.42,"");
    }
    leftDown=true;
    return;
  }

  if(zone==="right"){
    if(!rightDown&&state.mode===MODE.BONUS)arcadeRightPressed=true;
    if(!rightDown&&state.mode===MODE.PLAY){
      const f=state.screen===SCREEN.UPPER?FL.upperR:FL.lowerR;
      juiceReward("flip",f.x,f.y,.42,"");
    }
    rightDown=true;
    return;
  }

  if(state.mode===MODE.BONUS){
    arcadeActionDown=true;
    arcadeActionPressed=true;
    if(bonusGame.stage==="KINGDOM"){
      bonusJumpDown=true;
      bonusJumpPressed=true;
    }
  }else{
    beginCharge();
  }
}

function screenZoneOff(zone){
  screenZoneCounts[zone]=Math.max(0,screenZoneCounts[zone]-1);
  if(screenZoneCounts[zone]>0)return;

  if(zone==="left"){
    leftDown=false;
    return;
  }
  if(zone==="right"){
    rightDown=false;
    return;
  }

  if(state.mode===MODE.BONUS){
    arcadeActionDown=false;
    if(bonusGame.stage==="KINGDOM")bonusJumpDown=false;
  }else{
    releaseCharge();
  }
}

canvas.addEventListener("pointerdown",e=>{
  // Mouse remains usable for desktop testing; touch/pen get identical behavior.
  e.preventDefault();
  tryImmersiveFullscreen();
  const zone=screenZoneFromPointer(e);
  screenPointers.set(e.pointerId,zone);
  screenZoneOn(zone);
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
},{passive:false});

canvas.addEventListener("pointermove",e=>{
  if(!screenPointers.has(e.pointerId))return;
  e.preventDefault();
  const oldZone=screenPointers.get(e.pointerId);
  const newZone=screenZoneFromPointer(e);
  if(oldZone===newZone)return;
  screenZoneOff(oldZone);
  screenPointers.set(e.pointerId,newZone);
  screenZoneOn(newZone);
},{passive:false});

function releaseScreenPointer(e){
  if(!screenPointers.has(e.pointerId))return;
  e.preventDefault();
  const zone=screenPointers.get(e.pointerId);
  screenPointers.delete(e.pointerId);
  screenZoneOff(zone);
}
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  canvas.addEventListener(ev,releaseScreenPointer,{passive:false})
);

function clearDirectTouch(){
  screenPointers.clear();

function applyTestPolicy(policy,now,random){
  let l=false,r=false;

  // C / ARRANGER is part of a full playthrough. Skilled policies follow the
  // bonus ball, then carry the PHRASE to EXIT. Bad policies remain bad.
  if(state.mode===MODE.BONUS){
    let bx=bonusGame.ball.x;
    if(bonusGame.phase===1)bx=bonusGame.phrase.x;
    else if(bonusGame.phase===2)bx=bonusGame.ball.x;
    else if(bonusGame.phase===3)bx=760;
    if(policy==="none"){
      l=r=false;
    }else if(policy==="mash"){
      l=r=true;
    }else if(policy==="random"){
      l=random()<.18;r=random()<.18;
    }else if(policy==="twitch"){
      const phase=now%260;l=phase<55;r=phase>=130&&phase<185;
    }else if(policy==="late"){
      const d=bx-bonusGame.paddleX;
      if(Math.abs(d)>110){l=d<0;r=d>0}
    }else{
      const d=bx-bonusGame.paddleX;
      if(Math.abs(d)>14){l=d<0;r=d>0}
    }
    leftDown=l;rightDown=r;
    return;
  }
  if(policy==="none"){
    // no input
  }else if(policy==="mash"){
    l=r=true;
  }else if(policy==="reactive"){
    if(ball.phase===PHASE.FIELD&&ball.vy>0&&ball.y>570){
      if(ball.x<FIELD.center)l=true;else r=true;
    }
  }else if(policy==="rhythm"){
    if(ball.phase===PHASE.FIELD&&ball.y>510){
      const phase=(now+Math.floor(random()*40))%420;
      if(phase<78){if(ball.x<FIELD.center)l=true;else r=true}
    }
  }else if(policy==="timed"){
    if(ball.phase===PHASE.FIELD&&ball.vy>0&&ball.y>485){
      const targetY=792;
      const t=(targetY-ball.y)/Math.max(1,ball.vy);
      const pred=ball.x+ball.vx*clamp(t,0,.25);
      const lead=state.screen===SCREEN.UPPER?.105:.115;
      if(t>=0&&t<lead){if(pred<FIELD.center)l=true;else r=true}
    }
  }else if(policy==="control"){
    // Catch-oriented survival policy.
    if(ball.phase===PHASE.FIELD&&ball.vy>0&&ball.y>520){
      const t=(792-ball.y)/Math.max(1,ball.vy);
      const pred=ball.x+ball.vx*clamp(t,0,.22);
      if(t>=0&&t<.105){if(pred<FIELD.center)l=true;else r=true}
    }
    if(ball.phase===PHASE.FIELD&&Math.abs(ball.vy)<80&&ball.y>710){
      const cadence=(now%620);
      if(cadence>90){if(ball.x<FIELD.center)l=true;else r=true}
    }
  }else if(policy==="expert"){
    // Goal-aware test player. It uses a later CENTER flip after FLOW is armed.
    // This is not a cheat: it still only presses left/right and must make the shot.
    if(ball.phase===PHASE.FIELD&&ball.vy>0&&ball.y>470){
      const t=(792-ball.y)/Math.max(1,ball.vy);
      const pred=ball.x+ball.vx*clamp(t,0,.25);
      const lead=(state.screen===SCREEN.UPPER&&state.upperLockLit)?.060:.115;
      if(t>=0&&t<lead){if(pred<FIELD.center)l=true;else r=true}
    }
  }else if(policy==="random"){
    const slot=Math.floor(now/140),v=((slot*1664525+1013904223+(random()*65535|0))>>>0);
    l=(v&7)===0;r=((v>>4)&7)===0;
  }else if(policy==="twitch"){
    const phase=now%260;if(phase<55){const side=Math.floor(now/260)&1;l=side===0;r=side===1}
  }else if(policy==="late"){
    if(ball.phase===PHASE.FIELD&&ball.vy>0&&ball.y>690){if(ball.x<FIELD.center)l=true;else r=true}
  }
  leftDown=l;rightDown=r;
}

function median(values){
  const a=[...values].sort((x,y)=>x-y);
  return a.length?a[Math.floor(a.length/2)]:0;
}
function summarizePlaytests(rows){
  const policies=[...new Set(rows.map(r=>r.policy))];
  const out={};
  for(const p of policies){
    const a=rows.filter(r=>r.policy===p);
    out[p]={
      runs:a.length,
      medianScore:median(a.map(r=>r.score)),
      medianTime:+median(a.map(r=>r.time)).toFixed(2),
      medianEntries:median(a.map(r=>r.upperEntries)),
      releaseRuns:a.filter(r=>r.releases>0).length,
      totalReleases:a.reduce((s,r)=>s+r.releases,0),
      surgeRuns:a.filter(r=>r.surges>0).length,
      bestLoop:Math.max(...a.map(r=>r.bestLoop)),
      maxStill:Math.max(...a.map(r=>r.maxStill)),
      totalRescues:a.reduce((s,r)=>s+r.rescues,0),
      outOfBounds:a.reduce((s,r)=>s+r.outOfBounds,0),
      medianContacts:median(a.map(r=>r.flipperContacts))
    };
  }
  return out;
}
function runQualitySuite(runsPerPolicy=20,maxSeconds=120){
  const policies=["none","mash","reactive","rhythm","timed","control","expert","random","twitch","late"];
  const rows=[];
  for(const gameType of ["A","B"]){
    for(const policy of policies){
      for(let seed=1;seed<=runsPerPolicy;seed++)rows.push(runDeterministicPlaytest(policy,seed,maxSeconds,gameType));
    }
  }
  return{rows,summary:summarizePlaytests(rows)};
}

MOTORIK TRANCE v4 — HARD CLOCK

ROOT CAUSE OF "NOT FOUR-ON-THE-FLOOR":
v3 placed kicks on step 0/4/8/12, but the step scheduler itself was frame-driven:
  nextAt = now + sixteenth
If a frame arrived late, the engine advanced only one step and effectively lost
musical grid events. quantizedTime() then rounded events forward, making the
quarter-note pulse perceptually uneven.

v4 FIX:
- audio transport has its own absolute 16th-note timeline
- 120ms look-ahead scheduling
- while-loop recovery schedules EVERY missed step; no grid steps are skipped
- kick occurs unconditionally on 0 / 4 / 8 / 12
- bass moved to offbeats 2 / 6 / 10 / 14
- hook begins off the downbeat
- acid/stutter stay between kicks
- fixed kick tuning, independent of harmony

THE TEST FOR FOUR-ON-THE-FLOOR IS NOW TEMPORAL:

AMBIENT GUIDED v1

REFERENCE PRINCIPLES EXTRACTED FROM THE PROVIDED touch:waves SOURCE:
1) A stable background track/context exists before the user acts.
2) User triggers are quantized (touch:waves uses quantize(0.5) for 1/8 notes).
3) Button identity is remapped by context (sound_tbl / background track).
4) Group/exclusive/forcemono logic prevents incompatible overlap.
5) Randomness is constrained to curated tables rather than arbitrary pitch generation.
6) Gesture recording happens on a grid, so free input becomes coherent loops.
7) Touch can control global filter/retrigger behavior without escaping the grid.

THIS ENGINE TRANSLATES THOSE IDEAS TO PINBALL:
- background = ambient-electro bed + four-on-floor breathing pulse
- collision = high-level intent, NOT a note
- intents = TIDE / GLASS / PULSE / CHOIR / AIR
- all intents quantize to the next 1/8
- only one foreground intent may win per 1/8 (density governor)
- repeated same-role hits are collapsed by group cooldown
- every audible cell is selected from a hand-curated consonant table
- current world DIVE / DRIFT / ASCEND remaps register, width and brightness
- world changes happen only at bar boundaries
- score changes pleasure ceiling / filter / space, never spawns random rhythm
- quarter-note kick ducks only the tonal dry bus, producing physical breathing

PLAYER EXPERIENCE:
"I can hit anything and it sounds good" is an illusion created by aggressive hidden curation.
The player chooses energy and intention; the system secretly chooses timing,
voicing, register, density and compatible variation.

   the larger musical events.

physical pleasure is immediate,
musical structure remains protected.

- HIT CHAIN: tactile short-term skill
- RESONANCE XP / RANK: run-wide progression
- DIVE / DRIFT / ASCEND WORLD MASTERY: route-specific expertise
- SHADOW ARCHIVE DEPTH: rewards building useful loop memories
- BLOOM / CONSTELLATION / ASCENSION: macro progression
- RESONANCE reservoir: delayed spectral reward
